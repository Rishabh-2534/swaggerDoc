name: Microservice Deployment - Non Prod Environment
run-name: Deploying ${{ inputs.artifact }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment name'
        type: choice
        required: true
        options:
        - dev
        - test
        - perf
        - perft
        - migt
      branch:
        description: 'Branch name'
        type: choice
        required: true
        options:
        - develop
      artifact:
        description: 'Artifact Version'
        type: string
        required: false
jobs:
  deploy:
    name: Service Deployment
    uses: Simpplr/github-shared-library/.github/workflows/service-deploy.yaml@main
    with:
      BRANCH: "${{ inputs.branch }}"
      ENVIRONMENT: "${{ inputs.environment }}"
      ARTIFACT: "${{ inputs.artifact }}"
      TEAM_NAME: "integration"
    secrets: inherit

  scheduled-deploy:
    name: Scheduled Service Deployment
    uses: Simpplr/github-shared-library/.github/workflows/service-deploy.yaml@main
    with:
      BRANCH: "develop"
      ENVIRONMENT: "test" # or any other environment you want to target
      TEAM_NAME: "integration"
    secrets: inherit
    if: github.event_name == 'schedule'
