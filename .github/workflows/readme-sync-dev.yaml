name: Sync OpenAPI definition to ReadMe (DEV ZEUS)

# Run workflow for every push to the `develop` branch
on:
  push:
    branches:
      - develop

jobs:
  SyncToDev:
    runs-on: ubuntu-latest
    environment: 
      name: development
      url: 'https://hellosimpplr.readme.io/'
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3
      - name: Set Node.js version to 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Run GitHub Action to sync OpenAPI file at ./path-to-file.json
      - name: Validate and upload OpenAPI docs
        working-directory: ./services/ec-zeus
        run: |
          cd docs
          DEBUG=rdme* npx rdme@10 openapi upload ./ec-api-doc-dev.yaml --key=${{ secrets.DEV_README_API_KEY }} --slug=simpplr-user-api-documentation
          npx rdme@10 openapi upload ./ec-api-doc-b2b-dev.yaml --key=${{ secrets.B2B_DEV_README_API_KEY }} --slug=simpplr-b2b-api-documentation
