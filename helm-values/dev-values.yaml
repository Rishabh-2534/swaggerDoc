#***********************************************************************************************************#
# Dev Deployment Variables #
#***********************************************************************************************************#
microservicesName:
  ec-odin-service:
    nodeSelector:
      label: graviton-daemon
    tolerations:
      - effect: NoSchedule
        key: taint
        operator: Equal
        value: graviton-daemon
    tolerationsEnabled: true
    nodeSelectorEnabled: true
#***********************************************************************************************************#
# ConfigMap Variables #
#***********************************************************************************************************#

# Below configmap defination is required - merge your all configmap data and paste it here

configMap:
  data:
    NODE_ENV: DEV
    PORT: '5000'
    ENV: DEV
    AWS_SM_API_VERSION: 2017-10-17
    AWS_SM_REGION: us-west-2
    AWS_SM_KMS_KEY_ID: 4e4743d9-3b5c-45dc-b795-64a5dc995e86
    LOG_LEVEL: info
