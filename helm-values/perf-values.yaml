#***********************************************************************************************************#
# Dev Deployment Variables #
#***********************************************************************************************************#
microservicesName:
  ec-odin-service:
    nodeSelector:
      label: graviton-daemon
    tolerations:
      - effect: NoSchedule
        key: taint
        operator: Equal
        value: graviton-daemon
    tolerationsEnabled: true
    nodeSelectorEnabled: true
# Below array is required if you need any custome values -- It's optional
#***********************************************************************************************************#
# ConfigMap Variables #
#***********************************************************************************************************#
configMap:
  data:
    NODE_ENV: PERF
    PORT: '5000'
    ENV: PERF
    AWS_SM_API_VERSION: 2017-10-17
    AWS_SM_REGION: us-west-2
    LOG_LEVEL: info
