microservicesName:
  ec-odin-app:
    nodeSelector:
      label: graviton-daemon
    tolerations:
      - effect: NoSchedule
        key: taint
        operator: Equal
        value: graviton-daemon
    tolerationsEnabled: true
    nodeSelectorEnabled: true

configMap:
  data:
    NODE_ENV: PROD
    PORT: '5000'
    ENV: PROD
    AWS_SM_API_VERSION: 2017-10-17
    AWS_SM_REGION: us-west-2
    LOG_LEVEL: info
    
