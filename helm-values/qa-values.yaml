#***********************************************************************************************************#
# Dev Deployment Variables #
#***********************************************************************************************************#
microservicesName:
  ec-odin-app:
    nodeSelector:
      label: graviton-daemon
    tolerations:
      - effect: NoSchedule
        key: taint
        operator: Equal
        value: graviton-daemon
    tolerationsEnabled: true
    nodeSelectorEnabled: true
#***********************************************************************************************************#
# ConfigMap Variables #
#***********************************************************************************************************#

# Below configmap defination is required - merge your all configmap data and paste it here

configMap:
  data:
    NODE_ENV: QA
    PORT: '5000'
    ENV: DEV
    AWS_SM_API_VERSION: 2017-10-17
    AWS_SM_REGION: us-east-1
    AWS_SM_KMS_KEY_ID: 6cc95bc0-430f-4739-8ee4-9d9128690e00
    LOG_LEVEL: info
