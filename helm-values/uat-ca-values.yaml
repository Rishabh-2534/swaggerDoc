#***********************************************************************************************************#
# Dev Deployment Variables #
#***********************************************************************************************************#
microservicesName:
  ec-odin-service:
    nodeSelector:
      label: graviton-daemon
    tolerations:
      - effect: NoSchedule
        key: taint
        operator: Equal
        value: graviton-daemon
    tolerationsEnabled: true
    nodeSelectorEnabled: true

#***********************************************************************************************************#
# ConfigMap Variables #
#***********************************************************************************************************#
configMap:
  data:
    NODE_ENV: UAT
    PORT: '5000'
    ENV: UAT
    DB_DIALECT: postgres
    AWS_SM_REGION: ca-central-1
    AWS_SM_KMS_KEY_ID: 7d1d0d3c-f077-44d2-a433-f457f1056642
    LOG_LEVEL: info