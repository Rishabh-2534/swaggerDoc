<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simpplr B2B API – RapiDoc</title>
  <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    .auth-workaround {
      background: #fff3cd;
      border-bottom: 1px solid #ffc107;
      padding: 8px 16px;
      font-size: 13px;
      font-family: system-ui, sans-serif;
    }
    .auth-workaround code { background: #eee; padding: 2px 6px; border-radius: 3px; }
    rapi-doc { height: calc(100vh - 60px); min-height: 400px; }
  </style>
</head>
<body>
  
  <rapi-doc
    spec-url="ec-api-doc-b2b-dev.yaml"
    theme="light"
    render-style="view"
    show-header="true"
    allow-try="true"
    persist-auth="true"
    layout="column"
    schema-style="table"
  ></rapi-doc>
</body>
</html>
