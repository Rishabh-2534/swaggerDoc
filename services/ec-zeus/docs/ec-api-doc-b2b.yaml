---
openapi: 3.0.2
info:
    version: 1.0.0
    title: Simpplr B2B API Documentation
    description: "API documentation for Simpplr B2B integration services"
    contact:
      name: Simpplr Support
x-proxy-enabled: true
tags:
    - name: Authorization
      description: Everything about Authorization
    - name: Users
      description: Everything about Users
    - name: Sites
      description: Everything about Sites
    - name: Content
      description: Everything about Content
    - name: Files
      description: Everything about Files


servers:
    - url: https://platform.{env}.simpplr.com/v1
      variables:
        env:
            default: app
paths:
    # Authorization
    /identity/oauth/token:
        $ref: "./paths/identity/b2b/token.yaml"
    # Users
    /b2b/identity/users:
        $ref: "./paths/identity/b2b/get_create_users.yaml"
    /b2b/identity/users/{userId}:
        $ref: "./paths/identity/b2b/get_update_user.yaml"
    /b2b/identity/test:
        $ref: "./paths/identity/b2b/test.yaml"

    # Sites
    /b2b/content/sites:
        $ref: "./paths/content/b2b/sites.yaml"
    /b2b/content/sites/{siteId}:
        $ref: "./paths/content/b2b/site_by_id.yaml"
    /b2b/content/sites/{siteId}/membership/manage:
        $ref: "./paths/content/b2b/manage_site_membership.yaml"

    # Content
    /b2b/content/sites/contents:
        $ref: "./paths/content/b2b/get_content.yaml"
    /b2b/content/carousel-items:
        $ref: "./paths/content/b2b/get_carousel_items.yaml"
    /b2b/content/topics:
        $ref: "./paths/content/b2b/get_topics.yaml"
    /b2b/content/sites/members:
        $ref: "./paths/content/b2b/get_sites_members.yaml"
    /b2b/content/site-categories:
        $ref: "./paths/content/b2b/site_categories.yaml"
    /b2b/content/site-categories/{siteCategoryId}:
        $ref: "./paths/content/b2b/site_category_by_id.yaml"
    /b2b/content/sites/{site_id}/page-categories:
        $ref: "./paths/content/b2b/site_page_categories.yaml"
    /b2b/content/sites/{site_id}/page-categories/{category_id}:
        $ref: "./paths/content/b2b/site_page_category_by_id.yaml"

    # Files
    /b2b/content/static/signedurl/upload:
        $ref: "./paths/content/b2b/get_upload_signed_url.yaml"

components:
    securitySchemes:
        OAuth2ClientCredentials:
            type: "oauth2"
            description: "This API uses OAuth 2 with the implicit grant flow."
            flows:
                clientCredentials:
                    tokenUrl: https://platform.{env}.simpplr.xyz/v1/identity/oauth/token
                    scopes: {}
security:
    - OAuth2ClientCredentials: []
