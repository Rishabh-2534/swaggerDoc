---
openapi: 3.0.2
info:
    version: 1.0.0
    title: Simpplr API Documentation
    description: ""
tags:
    - name: Alerts
      description: Everything about Alerts

servers:
    - url: https://platform.dev.simpplr.xyz/v1
    - url: https://platform.test.simpplr.xyz/v1
    # - url: https://platform.qa.simpplr.xyz/v1
paths:
    # Authorization
    /identity/oauth/authorize:
        $ref: "./paths/identity/authorize.yaml"

    # Notifications
    /notifications:
        $ref: "./paths/notifications/create-search.yaml"
    /notifications/{notificationId}:
        $ref: "./paths/notifications/update.yaml"

    # Alerts
    /alerts:
        $ref: "./paths/alerts/create-search.yaml"
    /alerts/{alertId}:
        $ref: "./paths/alerts/update.yaml"


    # Video
    /video/tokens:
        $ref: "./paths/video/tokens.yaml"
    /video/entry/update:
        $ref: "./paths/video/update_status.yaml"
    /video/languages:
        $ref: "./paths/video/languages.yaml"
    /video/search:
        $ref: "./paths/video/search.yaml"
components:
    schemas:
        $ref: "./schemas/_index.yaml"
    responses:
        $ref: "./responses/_index.yaml"
    securitySchemes:
        OAuth2-US:
            type: "oauth2"
            description: "This API uses OAuth 2 with the implicit grant flow."
            flows:
                authorizationCode:
                    authorizationUrl: https://platform.test.simpplr.xyz/v1/account/integrations/ec/oauth2/url
                    tokenUrl: https://platform.test.simpplr.xyz/v1/account/integrations/ec/oauth2/url
                    scopes:
                        read: Read Access
                        write: Write Access