---
openapi: 3.0.2
info:
    version: 1.0.0
    title: Simpplr API Documentation
    description: ""
tags:
    - name: Notifications
      description: Everything about Notifications
    - name: Alerts
      description: Everything about Alerts

servers:
    - url: https://api.dev.simpplr.xyz/v1
    - url: https://api.test.simpplr.xyz/v1
paths:
    # Notifications
    /notification/create:
        $ref: "./paths/notifications/create.yaml"
    /notification/list:
        $ref: "./paths/notifications/search.yaml"
    /notification/{notificationId}:
        $ref: "./paths/notifications/update.yaml"

    # Alerts
    /alerts/list:
        $ref: "./paths/alerts/search.yaml"
    /alerts:
        $ref: "./paths/alerts/create.yaml"
    /alerts/{alertId}:
        $ref: "./paths/alerts/update.yaml"
components:
    schemas:
        $ref: "./schemas/_index.yaml"
    responses:
        $ref: "./responses/_index.yaml"
    securitySchemes:
        apiAuthSecurity:
            type: "oauth2"
            description: "This API uses OAuth 2 with the implicit grant flow."
            flows:
                implicit:
                    authorizationUrl: https://api.dev.simpplr.xyz/v1/identity/oauth/authorize
                    scopes:
                        read: "read data"
                        write: "create/update data"
                        everything: "allow full access"
security:
    - apiAuthSecurity: []
