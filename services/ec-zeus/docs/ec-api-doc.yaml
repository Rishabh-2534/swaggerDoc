---
openapi: 3.0.2
info:
    version: 1.0.0
    title: Simpplr User API Documentation
    description: ""
x-proxy-enabled: true
tags:
    - name: Authorization
      description: Everything about Authorization
    - name: Alerts
      description: Everything about Alerts
    - name: Audience
      description: Everything about Audience
    - name: Content
      description: Everything about Content
    - name: Enterprise search
      description: Everything about Enterprise search
    - name: Notifications
      description: Everything about Notifications
    - name: People
      description: Everything about People
    - name: Video
      description: Everything about Video
    - name: Sites
      description: Everything about Sites

servers:
    - url: https://platform.{env}.simpplr.com/v1
      variables:
        env:
            default: app
paths:
    # Authorization
    /identity/oauth/token:
        $ref: "./paths/identity/token.yaml"

    # Notifications
    /notifications:
        $ref: "./paths/notifications/create-search.yaml"
    /notifications/{notificationId}:
        $ref: "./paths/notifications/delete-update.yaml"

    # Alerts
    /alerts:
        $ref: "./paths/alerts/create-search.yaml"
    /alerts/{alertId}:
        $ref: "./paths/alerts/update-delete.yaml"

    # Audience
    /identity/audience:
        $ref: "./paths/identity/create_audience.yaml"
    /identity/audience/{audienceId}:
        $ref: "./paths/identity/update_audience.yaml"

    # People
    /identity/people:
        $ref: "./paths/identity/get_people_list.yaml"
    /identity/people/{peopleId}:
        $ref: "./paths/identity/update_people.yaml"

    # Video
    /video/tokens:
        $ref: "./paths/video/tokens.yaml"
    /video/entry/update:
        $ref: "./paths/video/update_status.yaml"
    /video/languages:
        $ref: "./paths/video/languages.yaml"
    /video/search:
        $ref: "./paths/video/search.yaml"

    # Sites
    /content/sites:
        $ref: "./paths/content/user/sites.yaml"
    /content/sites/{site_id}:
        $ref: "./paths/content/user/site_by_id.yaml"
    /content/sites/{site_id}/membership/manage:
        $ref: "./paths/content/user/manage_site_membership.yaml"

    # Content
    /content/sites/content/list:
        $ref: "./paths/content/search_content.yaml"
    /content/sites/list:
        $ref: "./paths/content/search_sites.yaml"
    /content/sites/{site_id}/content/{content_id}:
        $ref: "./paths/content/get_content_by_id.yaml"
    /content/files/list:
        $ref: "./paths/content/get_files.yaml"
    /content/site-categories:
        $ref: "./paths/content/user/site_categories.yaml"
    /content/site-categories/{siteCategoryId}:
        $ref: "./paths/content/user/site_category_by_id.yaml"
    /content/sites/{site_id}/page-categories:
        $ref: "./paths/content/user/site_page_categories.yaml"
    /content/sites/{site_id}/page-categories/{category_id}:
        $ref: "./paths/content/user/site_page_category_by_id.yaml"

     # Enterprise Search
    /enterprise-search/search:
        $ref: "./paths/search/top_search.yaml"
    /enterprise-search/autocomplete:
        $ref: "./paths/search/autocomplete_search.yaml"
    /enterprise-search/smartanswers:
        $ref: "./paths/search/smart_answers.yaml"

    # Service desk
    /service-desk/mtickets/workspaces:
        $ref: "./paths/service-desk/user/get_workspaces.yaml"
    /service-desk/mtickets/categories:
        $ref: "./paths/service-desk/user/get_ticket_categories.yaml"
    /service-desk/mtickets/categories/{categoryId}/items:
        $ref: "./paths/service-desk/user/get_ticket_category_items.yaml"
    /service-desk/wtickets/tickets/{ticketId}/comments:
        $ref: "./paths/service-desk/user/create_ticket_comment.yaml"


components:
    schemas:
        $ref: "./schemas/_index.yaml"
    responses:
        $ref: "./responses/_index.yaml"
    securitySchemes:
        apiAuthSecurity:
            type: "oauth2"
            description: "This API uses OAuth 2 with the implicit grant flow."
            flows:
                implicit:
                    authorizationUrl:  https://platform.test.simpplr.xyz/v1
                    scopes:
                        read: "read data"
                        write: "create/update data"
                        everything: "allow full access"
security:
    - apiAuthSecurity: []
