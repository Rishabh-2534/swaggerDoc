<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OAuth2 Redirect – Swagger UI</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 2rem auto;
      padding: 1rem;
      text-align: center;
      color: #334155;
    }
    p { margin: 0.5rem 0; }
    .small { font-size: 0.875rem; color: #64748b; }
  </style>
</head>
<body>
  <p>Completing OAuth2 redirect…</p>
  <p class="small">You can close this window if it doesn’t close automatically.</p>
  <script>
    'use strict';
  
    function run () {
      const oauth2 = window.opener.swaggerUIRedirectOauth2;
      if (!oauth2) {
        console.error('swaggerUIRedirectOauth2 not found');
        return;
      }
      console.log(oauth2);
      debugger;
      const qp = Object.fromEntries(
        new URLSearchParams(
          window.location.search || window.location.hash.substring(1)
        )
      );
  
      const isValid =true;// qp.state === oauth2.state;
  
      // Authorization Code flow
      if (
        (oauth2.auth.schema.get("flow") === "accessCode" ||
         oauth2.auth.schema.get("flow") === "authorizationCode") &&
        !oauth2.auth.code
      ) {
        if (!isValid) {
          oauth2.errCb({
            authId: oauth2.auth.name,
            source: "auth",
            level: "warning",
            message: "OAuth2 state mismatch"
          });
        }
  
        if (qp.code) {
          delete oauth2.state;
          oauth2.auth.code = qp.code;
          
          debugger;
          oauth2.callback({
            auth: oauth2.auth,
            redirectUrl: oauth2.redirectUrl
          });
        } else {
          oauth2.errCb({
            authId: oauth2.auth.name,
            source: "auth",
            level: "error",
            message: qp.error_description || "No authorization code received"
          });
        }
      } else {
        // implicit / token flow
        oauth2.callback({
          auth: oauth2.auth,
          token: qp,
          isValid,
          redirectUrl: oauth2.redirectUrl
        });
      }
  
      window.close();
    }
  
    run();
  </script>
  
</body>
</html>
