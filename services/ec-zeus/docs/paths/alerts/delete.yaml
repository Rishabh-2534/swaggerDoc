delete:
  tags:
    - Alerts
  summary: Delete alert
  description: Use this API to delete alert
  parameters:
    - name: alertId
      in: path
      description: "ID of alert to delete"
      required: true
      schema:
        type: string
  requestBody:
    description: Delete alert
    content:
      application/json:
        schema:
          $ref: "../../schemas/alerts/delete_request.yaml"
    required: true
  responses:
    200:
      $ref: "../../responses/alerts/delete_success.yaml"
    403:
      $ref: "../../responses/common/unauthorized.yaml"
    400:
      $ref: "../../responses/common/validation_error.yaml"
