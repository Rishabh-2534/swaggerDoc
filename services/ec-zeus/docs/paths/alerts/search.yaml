get:
  tags:
    - Alerts
  summary: Search alerts
  description: Search api allows us to retrieves list of alerts, encompassing active, scheduled and expired alerts.
  parameters:
    - name: size
      in: query
      description: Payload size
      schema:
        type: integer
        format: int64
        example: 10
    - name: nextPageToken
      in: query
      description: Token for next page
      schema:
        type: string
    - name: recipient
      in: query
      description: 'Receiving audience. Allowed values: everyone , {site-id}'
      schema:
        type: string
    - name: term
      in: query
      description: 'Search term'
      schema:
        type: string
    - name: sortBy
      in: query
      description: Sorting order for Alerts
      schema:
        type: string
        enum:
        - created_newest
        - created_oldest
        - display_from_date_newest
        - display_from_date_oldest
        - display_to_date_newest
        - display_to_date_oldest
    - name: filter
      in: query
      description: How to filter Alerts
      schema:
        type: string
        default: all
        enum:
        - all
        - scheduled
        - active
        - expired
  responses:
    200:
      $ref: "../../responses/alerts/search_success.yaml"
    403:
      $ref: "../../responses/common/unauthorized.yaml"
    503:
      $ref: "../../responses/alerts/search_error.yaml"

