post:
  tags:
    - Alerts
  summary: Create a new alert
  description: Use this API to create a new alert
  requestBody:
    description: Create a new alert
    content:
      application/json:
        schema:
          $ref: "../../schemas/alerts/create_request.yaml"
    required: true
  responses:
    200:
      $ref: "../../responses/alerts/create_success.yaml"
    400:
      $ref: "../../responses/alerts/create_error.yaml"
    401:
      $ref: "../../responses/common/unauthorized.yaml"
    403:
      $ref: "../../responses/common/forbidden.yaml"
      
get:
  tags:
    - Alerts
  summary: Search alerts
  description: Use this API to search alerts
  requestBody:
    description: Search alerts
    content:
      application/json:
        schema:
          $ref: "../../schemas/alerts/search_request.yaml"
    required: true
  responses:
    200:
      $ref: "../../responses/alerts/search_success.yaml"
    403:
      $ref: "../../responses/common/unauthorized.yaml"
    503:
      $ref: "../../responses/alerts/search_error.yaml"

