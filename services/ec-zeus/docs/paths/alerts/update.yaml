put:
  tags:
    - Alerts
  summary: Update alert
  description: Use this API to update/expire/delete alert
  parameters:
    - name: alertId
      in: path
      description: "ID of alert to update"
      required: true
      schema:
        type: string
  requestBody:
    description: Update alert
    content:
      application/json:
        schema:
          $ref: "../../schemas/alerts/update_request.yaml"
    required: true
  responses:
    200:
      $ref: "../../responses/alerts/update_success.yaml"
    403:
      $ref: "../../responses/common/unauthorized.yaml"
    400:
      $ref: "../../responses/common/validation_error.yaml"
