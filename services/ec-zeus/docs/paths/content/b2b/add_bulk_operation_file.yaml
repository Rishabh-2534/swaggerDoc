post:
  summary: Add file to bulk operation
  operationId: addBulkOperationFileB2b
  tags:
    - Content
  description: This API allows us to add/associate a file with a bulk operation using the request ID
  parameters:
    - name: opType
      in: path
      required: true
      schema:
        type: string
        enum: ["content-author-change", "content-author-report-generation"]
        example: "content-author-report-generation"
      description: The type of bulk operation
  requestBody:
    $ref: '../../../schemas/content/b2b/request/add_bulk_operation_file_request.yaml'
  responses:
    '200':
      $ref: '../../../responses/content/common/bulkOperationFiles/bulk_operation_files_success.yaml'
    '400':
      $ref: '../../../responses/content/common/bulkOperationFiles/bulk_operation_files_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'
    '404':
      $ref: '../../../responses/content/common/bulkOperationFiles/bulk_operation_files_not_found.yaml'
