  summary: Get files from a site
  description: This API allows us to fetch files from a site by providing the corresponding Site ID
  requestBody:
    description: Get Files from a Site
    content:
      application/json:
        schema:
          $ref: '../../../schemas/content/b2b/request/get_files.yaml'
    required: true
  responses:
    200:
      $ref: "../../../responses/content/getFiles/get_files_success.yaml"
    400:
      $ref: "../../../responses/content/getFiles/get_files_error.yaml"
    401:
      $ref: "../../../responses/common/unauthorized.yaml"
    403:
      $ref: "../../../responses/common/forbidden.yaml" 