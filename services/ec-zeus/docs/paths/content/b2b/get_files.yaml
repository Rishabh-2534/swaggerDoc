post:
  operationId: getFilesFromSiteB2B
  tags:
    - Files
  summary: Get files
  description:
    This API lets you search for files in different scopes like across sites, within a site, within a content or a particular file.
  requestBody:
    description: Get Files using site ID, content ID, or file ID
    content:
      application/json:
        schema:
          $ref: '../../../schemas/content/b2b/request/get_files_request.yaml'
    required: true
  responses:
    200:
      $ref: "../../../responses/content/common/getFiles/get_files_success.yaml"
    400:
      $ref: "../../../responses/content/common/getFiles/get_files_error.yaml"
    401:
      $ref: "../../../responses/common/unauthorized.yaml"
    403:
      $ref: "../../../responses/common/forbidden.yaml" 