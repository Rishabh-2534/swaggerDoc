post:
  summary: Get a presigned URL to upload a file to Simpplr
  operationId: getUploadSignedUrlB2b
  tags:
    - Files
  description: |
    This API allows us to get a presigned URL for uploading files to Simpplr.
    Few points to note:
    * The upload_url(presigned URL) in the response should be used with PUT method to upload the file.
    * The presigned URL should be invoked with same Bearer token as this API.
    * The file_id should be saved for linking with entities via other APIs.
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../../schemas/content/b2b/request/get_upload_signed_url.yaml'
  responses:
    '200':
      $ref: '../../../responses/content/common/getUploadSignedUrl/get_upload_signed_url_success.yaml'
    '400':
      $ref: '../../../responses/content/common/getUploadSignedUrl/get_upload_signed_url_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'