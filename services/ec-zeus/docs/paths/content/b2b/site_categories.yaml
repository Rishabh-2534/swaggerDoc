get:
  operationId: getSiteCategories
  tags:
    - Content
  summary: Get site categories
  description: This API allows us to obtain list of site categories
  parameters:
    $ref: '../../../schemas/content/b2b/request/siteCategory/get_site_categories_request.yaml'
  responses:
    '200':
      $ref: '../../../responses/content/b2b/getSiteCategories/get_site_categories_success.yaml'
    '400':
      $ref: '../../../responses/content/b2b/getSiteCategories/get_site_categories_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
