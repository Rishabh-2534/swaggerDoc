get:
  tags:
    - Content
  summary: Get content by ID
  description: This API allows us to retrieve detailed information about a specific page or event by providing its unique ID
  parameters:
    - name: siteId
      in: path
      description: ID of the Site whose content is to be searched
      schema:
        type: string
        example: "eb4a3545-05f7-46e8-b17d-107339b6aae6"
      required: true
    - name: contentId
      in: path
      description: ID of the Content to be searched
      schema:
        type: string
        example: "8b989940-32c9-491f-965c-b92ccd61ae3e"
      required: true
  responses:
    200:
      $ref: ../../responses/content/searchContentById/search_content_by_id_success.yaml
    400:
      $ref: ../../responses/content/searchContentById/search_content_by_id_error.yaml
    401:
      $ref: ../../responses/common/unauthorized.yaml
    403:
      $ref: ../../responses/common/forbidden.yaml

delete:
  operationId: deleteContentUser
  tags:
    - Content
  summary: Delete content from a site
  description: This API allows us to delete content from a site
  parameters:
    - name: siteId
      in: path
      required: true
      schema:
        type: string
        example: "b84213f8-0499-4a51-af09-75ff12c8ae50"
      description: The ID of the site containing the content
    - name: contentId
      in: path
      required: true
      schema:
        type: string
        example: "e62af0b9-bbaf-4a46-bdae-72453716b51d"
      description: The ID of the content to delete
  responses:
    '200':
      $ref: '../../responses/content/common/deleteContent/delete_content_success.yaml'
    '400':
      $ref: '../../responses/content/common/deleteContent/delete_content_error.yaml'
    '401':
      $ref: '../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../responses/common/forbidden.yaml'
