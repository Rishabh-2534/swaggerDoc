post:
  operationId: getFilesFromSiteUser
  tags:
    - Files
  summary: Get files
  description: |
    This API lets you search for files within a site using multiple parameters.

    Key points:
    * Use `siteId` to search within a specific site
    * Use `contentId` to find files linked to specific content
    * Provide a file `id` for direct retrieval
    * Filter results using `provider`, `sortBy`, `filter`, `directory`, and `context`
    * Limit the number of results with the `size` parameter
    * Use a search `term` to find files by name or content

  requestBody :
     description: Get Files using site ID, content ID, or file ID
     content:
      application/json:
        schema:
          $ref: '../../schemas/content/get_files.yaml'
     required: true
  responses:
    200:
      $ref: "../../responses/content/getFiles/get_files_success.yaml"
    400:
      $ref: "../../responses/content/getFiles/get_files_error.yaml"
    401:
      $ref: "../../responses/common/unauthorized.yaml"
    403:
      $ref: "../../responses/common/forbidden.yaml"
