get:
  tags:
    - Content
  summary: Get Site By Id
  description: This API allows us to obtain detailed information about a site by providing its unique Site ID
  parameters:
    - name: siteId
      in: path
      description: ID of the Site to search for
      schema:
        type: string
        example: "19b963b1-928b-42cd-a002-fc47827c6f58"
      required: true
  responses:
    200:
      $ref: ../../responses/content/getSite/get_site_success.yaml
    400:
      $ref: ../../responses/content/getSite/get_site_error.yaml
    401:
      $ref: ../../responses/common/unauthorized.yaml
    403:
      $ref: ../../responses/common/forbidden.yaml
