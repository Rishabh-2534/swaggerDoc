post:
  tags:
    - Content
  summary: Search for contents
  description: This API allows us to search for and retrieve a list of contents based on the specified filters provided in the request body
  requestBody :
     description: Get list of content based on request body from a Site
     content:
      application/json:
        schema:
          $ref: '../../schemas/content/search_content.yaml'
     required: true
  responses:
    200:
      $ref: ../../responses/content/searchContent/search_content_success.yaml
    400:
      $ref: ../../responses/content/searchContent/search_content_error.yaml
    401:
      $ref: ../../responses/common/unauthorized.yaml
    403:
      $ref: ../../responses/common/forbidden.yaml
