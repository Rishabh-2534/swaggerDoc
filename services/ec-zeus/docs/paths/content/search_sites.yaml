post:
  operationId: searchSites
  tags:
    - Sites
  summary: Search for sites
  description: This API allows us to search for and retrieve a list of sites based on the filter provided in the request body.
  requestBody :
     description: Get list of sites based on request body from a Site
     content:
      application/json:
        schema:
          $ref: '../../schemas/content/search_sites.yaml'
     required: true

  responses:
    200:
      $ref: ../../responses/content/searchSites/search_sites_success.yaml
    400:
      $ref: ../../responses/content/searchSites/search_sites_error.yaml
    401:
      $ref: ../../responses/common/unauthorized.yaml
    403:
      $ref: ../../responses/common/forbidden.yaml
