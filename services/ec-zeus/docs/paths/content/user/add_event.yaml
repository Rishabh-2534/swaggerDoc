post:
  operationId: addEventUser
  tags:
    - Content
  summary: Add an event to a site
  description: This API allows us to add an event to a site
  parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
        example: "eb4a3545-05f7-46e8-b17d-107339b6aae6"
      description: The ID of the site to add an event to
    - name: action
      in: query
      required: true
      schema:
        type: string
        example: "publish"
        enum:
          - publish
          - saveDraft
      description: The action to perform on the event
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../../schemas/content/user/request/site/content/add_event_request.yaml'
  responses:
    '200':
      $ref: '../../../responses/content/user/addEvent/add_event_success.yaml'
    '400':
      $ref: '../../../responses/content/user/addEvent/add_event_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'
