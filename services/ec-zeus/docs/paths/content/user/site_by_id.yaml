get:
  operationId: getSiteById
  tags:
    - Sites
  summary: Get site by ID
  description: This API allows us to obtain detailed information about a site by providing its unique Site ID
  parameters:
    - name: site_id
      in: path
      description: ID of the Site to search for
      schema:
        type: string
        example: "eb4a3545-05f7-46e8-b17d-107339b6aae6"
      required: true
  responses:
    200:
      $ref: '../../../responses/content/getSite/get_site_success.yaml'
    400:
      $ref: '../../../responses/content/getSite/get_site_error.yaml'
    401:
      $ref: '../../../responses/common/unauthorized.yaml'
    403:
      $ref: '../../../responses/common/forbidden.yaml'


put:
    summary: Update site
    operationId: updateSiteUser
    tags:
      - Sites
    description: This API allows us to update an existing site user
    parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the site user to update
    requestBody:
      $ref: '../../../schemas/content/user/request/update_site_user_request.yaml'
    responses:
      '200':
        $ref: '../../../responses/content/b2b/updateSite/update_site_success.yaml'
      '400':
        $ref: '../../../responses/content/b2b/updateSite/update_site_error.yaml'
      '401':
        $ref: '../../../responses/common/unauthorized.yaml'
      '403':
        $ref: '../../../responses/common/forbidden.yaml'