get:
  operationId: getSiteCategoriesUser
  tags:
    - Sites
  summary: Get site categories
  description: This API allows us to obtain list of site categories
  parameters:
    $ref: '../../../schemas/content/user/request/siteCategory/get_site_categories_request.yaml'
  responses:
    '200':
      $ref: '../../../responses/content/user/getSiteCategories/get_site_categories_success.yaml'
