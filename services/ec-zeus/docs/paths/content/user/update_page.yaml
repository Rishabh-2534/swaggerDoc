patch:
  operationId: updatePageUser
  tags:
    - Content
  summary: Update a page in a site
  description: This API allows us to update an existing page in a site
  parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
        example: "eb4a3545-05f7-46e8-b17d-107339b6aae6"
      description: The ID of the site containing the page
    - name: content_id
      in: path
      required: true
      schema:
        type: string
        example: "d096db67-954a-4ff5-94a7-ccc437f2fd81"
      description: The ID of the content/page to update
    - name: action
      in: query
      required: true
      schema:
        type: string
        example: "publish"
        enum:
          - update
          - updateDraft
          - updateApprove
      description: The action to perform on the page
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../../schemas/content/user/request/site/content/update_page_request.yaml'
  responses:
    '200':
      $ref: '../../../responses/content/common/updatePage/update_page_success.yaml'
    '400':
      $ref: '../../../responses/content/common/updatePage/update_page_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'
