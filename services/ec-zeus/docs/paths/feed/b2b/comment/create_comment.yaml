post:
  operationId: createCommentB2B
  tags:
    - Feed
  parameters:
    - name: feedId
      in: path
      required: true
      schema:
        type: string
        example: "ff411eea-55b7-41ac-87d8-572f80fdf79a"
      description: ID of the feed to add comment to
  summary: Create Comment
  description: This API allows B2B partners to add a comment to a feed.
  requestBody:
    $ref: '../../../../schemas/feed/b2b/request/create_comment_request.yaml'
  responses:
    '201':
      $ref: '../../../../responses/feed/b2b/createComment/create_comment_success.yaml'
    '400':
      $ref: '../../../../responses/feed/b2b/createComment/create_comment_error.yaml'
    '401':
      $ref: '../../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../../responses/common/forbidden.yaml'
