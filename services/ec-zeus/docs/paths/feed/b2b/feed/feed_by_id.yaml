get:
  operationId: getFeedByIdB2b
  tags:
    - Feed
  summary: Get feed by ID
  description: This API allows you to retrieve a specific feed by its ID
  parameters:
    - name: feedId
      in: path
      description: ID of the feed to retrieve
      required: true
      schema:
        type: string
        example: "eb4a3545-05f7-46e8-b17d-107339b6aae6"
  responses:
    200:
      $ref: '../../../../responses/feed/b2b/getFeed/get_feed_success.yaml'
    400:
      $ref: '../../../../responses/feed/b2b/getFeed/get_feed_error.yaml'
    401:
      $ref: '../../../../responses/common/unauthorized.yaml'
    403:
      $ref: '../../../../responses/common/forbidden.yaml'
