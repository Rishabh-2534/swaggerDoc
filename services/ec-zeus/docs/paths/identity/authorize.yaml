post:
  tags:
    - Authorization
  summary: Authorization
  description: This API allows you to generate the access token or refresh token for authorization code.
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../schemas/identity/authorize_request.yaml'
    required: true
  responses:
    200:
      $ref: '../../responses/identity/auth_success.yaml'
    400:
      $ref: '../../responses/identity/auth_error.yaml'
    401:
      $ref: '../../responses/common/unauthorized.yaml'
    403:
      $ref: '../../responses/common/forbidden.yaml'
