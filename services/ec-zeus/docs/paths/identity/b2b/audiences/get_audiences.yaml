get:
  operationId: getAudiences
  tags:
    - Audience
  summary: Get audiences
  description: >
    This API allows you to retrieve a list of all audiences for the tenant.
  parameters:
    - name: pageSize
      in: query
      description: A limit on the number of audiences to return in a request.
      schema:
        type: integer
        example: 10
    - name: pageToken
      in: query
      description: Token for next page
      schema:
        type: integer
        example: 10
    - name: searchTerm
      in: query
      description: Search term to filter audiences by name
      schema:
        type: string
        example: "marketing"
    - name: audienceCategoryId
      in: query
      description: >
        Audience category ID to filter by.


        This is valid for only ABAC enabled tenants. For non-ABAC tenants, whatever you pass here will be ignored.
      schema:
        type: string
        example: "4ba58d96-9ac2-4820-88ef-28aa4555500d"
    - name: parentAudienceId
      in: query
      description: >
        Parent audience ID to filter by.


        This is valid for only ABAC enabled tenants. For non-ABAC tenants, whatever you pass here will be ignored.
      schema:
        type: string
        example: "7ca58d96-8ac2-4820-88eu-28aa4555500e"
  responses:
    "200":
      $ref: '../../../../responses/identity/b2b/audiences/get_audiences_success.yaml'
    "401":
      $ref: '../../../../responses/common/unauthorized.yaml'
    "403":
      $ref: '../../../../responses/common/forbidden.yaml'
    "400":
      $ref: '../../../../responses/identity/b2b/audiences/audiences_error.yaml'
