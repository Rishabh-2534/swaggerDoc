get:
  operationId: getUsers
  tags:
    - Users
  summary: Get Users
  description: >
        This API allows you to get all users of a tenant.
  parameters:
    - name: pageSize
      in: query
      description: The number of users to return per page.
      required: false
      schema:
        type: integer
        default: 50
    - name: pageToken
      in: query
      description: Should be a integer returned as `nextPageToken` from previous page request
      required: false
      schema:
        type: integer
    - name: includeTotal
      in: query
      description: >
        Whether to include the total number of users in the response.
        To include set it to `true`
      required: false
      schema:
        type: string
        example: "false"
    - name: fields
      in: query
      description: |
        Comma separated list of fields to include in the response.
        use `all` to include all fields
        use `minimal` to include only the login identifiers
        use comma separated field names to include specific fields `Ex: firstName,lastName,etc`
      required: false
      schema:
        default: minimal
        oneOf:
          - type: string
            description: |
              use `all` to include all fields
              use `minimal` to include only the login identifiers
            enum:
              - all
              - minimal
          - type: string
            description: |
              use comma separated field names to include specific fields `Ex: firstName,lastName,etc`
            example: firstName,lastName,etc
    - name: modifiedAfter
      in: query
      description: Filter users modified after this date-time. Must be in ISO 8601 UTC format (e.g. 2025-04-09T18:30:00.000Z)
      required: false
      schema:
        type: string
        format: date-time
        example: "2025-04-09T18:30:00.000Z"
    - name: sortBy
      in: query
      description: |
        Field to sort the users by
        value can be csv `Ex: firstName:ASC,lastName:DSC`
      required: false
      schema:
        type: string
        example: firstName:ASC,lastName:DSC
    - name: employeeNumber
      in: query
      description: filter users by employee number
      required: false
      schema:
        type: string
        example: "E123"
    - name: firstName
      in: query
      description: filter users by first name
      required: false
      schema:
        type: string
        example: "John"       
  responses:
    '200':
      $ref: '../../../responses/identity/b2b/get_users_success.yaml'
    '400':
      $ref: '../../../responses/identity/b2b/get_users_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'


post:
  operationId: createUser
  tags:
    - Users
  summary: Create User
  description: |
    This API allows you to create a new user.

    ```json
    {
      "email": "...",
      "firstName": "...",
      "lastName": "..."
    }
    ```
    Above show the minimum set of fields to create a User. `email` is a login identifier in this case.

    **If for tenant other fields are marked as login identifiers one of the login identifiers need to be present**
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../../schemas/identity/Users/create_user.yaml'
  responses:
    '201':
      $ref: '../../../responses/identity/b2b/create_user_success.yaml'
    '400':
      $ref: '../../../responses/identity/b2b/create_update_user_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'