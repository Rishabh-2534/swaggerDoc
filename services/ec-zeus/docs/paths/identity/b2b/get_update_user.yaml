get:
  operationId: getUser
  tags:
    - Users
  summary: Get User by ID
  description: This API allows you to get a user by ID
  parameters:
    - name: userId
      in: path
      description: The ID of the user to get
      required: true
      schema:
        type: string
        format: uuid
        example: "123e4567-e89b-12d3-a456-426614174000"
    - name: parseCustomFields
      in: query
      description: Whether to parse custom fields (if custom field types enabled)
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
        default: 'false'
  responses:
    '200':
      $ref: '../../../responses/identity/b2b/get_user_success.yaml'
    '400':
      $ref: '../../../responses/identity/b2b/get_user_error.yaml'
    '404':
      $ref: '../../../responses/identity/b2b/get_user_404_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'

put:
  operationId: updateUserPut
  tags:
    - Users
  summary: Update user (all fields)
  description: |
    This API allows you to update a user by ID (all fields required)
  parameters:
    - name: userId
      in: path
      description: The ID of the user to update
      required: true
      schema:
        type: string
        format: uuid
        example: "123e4567-e89b-12d3-a456-426614174000"
  requestBody:
    description: |
      The user object to update
      Note: if birthDate is provided, birthDayDay and birthDayMonth are not required and vice versa.
      Listed below are 2 kind of payloads:
      1) birthDate is provided
      2) birthDayDay and birthDayMonth are provided
    content:
      application/json:
        schema:
          $ref: '../../../schemas/identity/Users/update_user_put.yaml'
  responses:
    '204':
      description: User updated successfully
    '400':
      $ref: '../../../responses/identity/b2b/update_user_error.yaml'
    '404':
      $ref: '../../../responses/identity/b2b/get_user_404_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'

patch:
  operationId: updateUserPatch
  tags:
    - Users
  summary: Update user (delta update)
  description: |
    This api allows you to update a user by ID (delta update) i.e. only the fields provided in the request body will be updated.
    To clear value explicitly pass `null`.
  parameters:
    - name: userId
      in: path
      description: The ID of the user to update
      required: true
      schema:
        type: string
        format: uuid
        example: "123e4567-e89b-12d3-a456-426614174000"
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../../schemas/identity/Users/update_user_patch.yaml'
  responses:
    '204':
      description: User updated successfully
    '400':
      $ref: '../../../responses/identity/b2b/update_user_error.yaml'
    '404':
      $ref: '../../../responses/identity/b2b/get_user_404_error.yaml'
    '401':
      $ref: '../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../responses/common/forbidden.yaml'