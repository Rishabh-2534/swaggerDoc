post:
  operationId: uploadFilesB2b
  tags:
    - Files
    - Users
  summary: Upload files for users
  description: |
    This API allows you to get presigned URLs for uploading files (photos or cover images) for users.
    
    The API accepts the following file types:
    - **photo**: User profile photo
    - **coverImage**: User cover image
    
    **Important notes:**
    - The upload_url (presigned URL) in the response should be used with PUT method to upload the file.
    - The presigned URL should be invoked with the same Bearer token as this API.
    - The file_id should be saved for linking with the user via other APIs.
    
    **Example request:**
    ```json
    {
      "useFor": "photo",
      "userId": "123e4567-e89b-12d3-a456-426614174000",
      "mimeType": "image/jpeg",
      "size": 1024000
    }
    ```
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../../../schemas/identity/users/upload_files_request.yaml'
  responses:
    '201':
      $ref: '../../../../responses/identity/b2b/upload_files_success.yaml'
    '400':
      $ref: '../../../../responses/identity/b2b/upload_files_error.yaml'
    '401':
      $ref: '../../../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../../../responses/common/forbidden.yaml'
