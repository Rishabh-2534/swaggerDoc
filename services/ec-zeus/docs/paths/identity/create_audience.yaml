post:
  tags:
    - Audience
  summary: Create a new Audience
  description: >
        This API allows you to create a new Audience for a tenant. 
        Example request body:

        ```json

        when listOfConditions selected

        {
          "name": "Engineers",
          "type": "conditions",
          "listOfPeople": [], // this should be set to empty array 
          "listOfConditions": [
            {
              "name": "department",
              "label": "Department",
              "values": [
                {
                  "id": "Engineering",
                  "name": "Engineering", // required in values
                  "userCount": 0,
                  "authoredBy": null,
                  "canEdit": null,
                  "canDelete": null,
                  "isNew": null,
                  "isFollowing": null,
                  "img": null
                }
              ]
            }
          ]
        }

        when listOfPeople selected
        {
          "name": "Engineers",
          "type": "people",
          "listOfPeople": [] ,// array of user ids
          "listOfConditions": [] // this should be set to empty array 
        }
        ```
  requestBody:
    description: Create a new Audience
    content:
      application/json:
        schema:
          $ref: '../../schemas/identity/audience/create_request.yaml'
    required: true
  responses:
    200:
      $ref: '../../responses/identity/audience/create_success.yaml'
    400:
      $ref: '../../responses/identity/audience/audience_error.yaml'
    401:
      $ref: '../../responses/common/unauthorized.yaml'
    403:
      $ref: '../../responses/common/forbidden.yaml'