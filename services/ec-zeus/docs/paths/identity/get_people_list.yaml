post:
  tags:
    - People
  summary: Get people list with search or filter
  description: >
    This API allows you to get people list using search and filters.
    Example body request:

    ```json
      {
        "q": "" // if no values to be search, this should be sent as empty string.
      }
    ```
  requestBody:
    description: Get people list
    content:
      application/json:
        schema:
          $ref: '../../schemas/identity/people/get_people_list_request.yaml'
    required: true
  responses:
    200:
      $ref: '../../responses/identity/people/get_people_list_success.yaml'
    400:
      $ref: '../../responses/identity/people/people_error.yaml'
    401:
      $ref: '../../responses/common/unauthorized.yaml'
    403:
      $ref: '../../responses/common/forbidden.yaml'