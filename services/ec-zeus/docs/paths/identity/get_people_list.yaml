post:
  operationId: listPeople
  tags:
    - People
  summary: List people with search or filter
  description: >
    You can filter by standard fields (like `department`, `division`, `title`) or custom fields 
    (ending with `__c`, like `team__c`).


    Example request payload showing filter applied on a standard field (department) and a custom field (team__c):
    The query finds users in one of the two Marketing department teams.

    ```

    {
      "pageSize": 10,
      "department": ["Marketing"],
      "team__c": ["Branding Brainiacs", "Ad-Vengers"]
    }

    ```
  requestBody:
    description: Get people list
    content:
      application/json:
        schema:
          $ref: '../../schemas/identity/people/get_people_list_request.yaml'
    required: true
  responses:
    "200":
      $ref: '../../responses/identity/people/get_people_list_success.yaml'
    "400":
      $ref: '../../responses/identity/people/get_people_list_error.yaml'
    "401":
      $ref: '../../responses/common/unauthorized.yaml'
    "403":
      $ref: '../../responses/common/forbidden.yaml'