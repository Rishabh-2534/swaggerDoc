put:
  tags:
    - Audience
  summary: Update an audience (v2)
  description: >
    This API allows you to update an existing audience.
  parameters:
    - name: audienceId
      in: path
      description: "ID of audience to update"
      required: true
      schema:
        type: string
  requestBody:
    description: Update an audience (v2)
    content:
      application/json:
        schema:
          $ref: '../../schemas/identity/audience/update_request_v2.yaml'
    required: true
  responses:
    200:
      $ref: '../../responses/identity/audience/update_success_v2.yaml'
    401:
      $ref: '../../responses/common/unauthorized.yaml'
    403:
      $ref: '../../responses/common/forbidden.yaml'
    400:
      $ref: '../../responses/common/validation_error.yaml'
    404:
      $ref: '../../responses/identity/audience/audience_error.yaml'
