patch:
  tags:
    - People
  summary: Update People
  description: This API allows you to update existing People.
  parameters:
    - name: peopleId
      in: path
      description: "ID of People to update"
      required: true
      schema:
        type: string
  requestBody:
    description: Update People
    content:
      application/json:
        schema:
          $ref: "../../schemas/identity/people/update_people.yaml"
    required: true
  responses:
    200:
      $ref: "../../responses/identity/people/update_success.yaml"
    401:
      $ref: "../../responses/common/unauthorized.yaml"
    403:
      $ref: "../../responses/common/forbidden.yaml"
    400:
      $ref: "../../responses/common/validation_error.yaml"