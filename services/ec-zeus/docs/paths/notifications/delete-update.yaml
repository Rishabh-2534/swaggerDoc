put:
  tags:
    - Notifications
  summary: Update notification
  description: This API allows you to update existing notification. You can perform action on any `actionable` notification or you can delete any notification.
  parameters:
    - name: notificationId
      in: path
      description: "ID of notification to update"
      required: true
      schema:
        type: string
  requestBody:
    description: Update notification
    content:
      application/json:
        schema:
          $ref: "../../schemas/notifications/update_request.yaml"
    required: true
  responses:
    200:
      $ref: "../../responses/notifications/update_success.yaml"
    401:
      $ref: "../../responses/common/unauthorized.yaml"
    403:
      $ref: "../../responses/common/forbidden.yaml"
    400:
      $ref: "../../responses/common/validation_error.yaml"
delete:
  tags:
    - Notifications
  summary: Delete notification
  description: This API allows you to delete existing notification.
  parameters:
    - name: notificationId
      in: path
      description: "ID of notification to delete"
      required: true
      schema:
        type: string
  responses:
    200:
      $ref: "../../responses/notifications/delete_success.yaml"
    401:
      $ref: "../../responses/common/unauthorized.yaml"
    403:
      $ref: "../../responses/common/forbidden.yaml"
    400:
      $ref: "../../responses/common/validation_error.yaml"