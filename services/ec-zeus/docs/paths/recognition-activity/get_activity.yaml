get:
  tags:
    - Recognition
  summary: Get recognition activity
  description: Retrieve recognition activity data with optional filtering and pagination
  operationId: getRecognitionActivity
  parameters:
    - name: locations
      in: query
      description: Comma-separated locations to filter by (e.g., India,US)
      required: false
      schema:
        type: string
    - name: departments
      in: query
      description: Comma-separated departments to filter by (e.g., Engineering,Sales,HR)
      required: false
      schema:
        type: string
    - name: type
      in: query
      description: Comma-separated award types to filter by (e.g., SPOT,PEER)
      required: false
      schema:
        type: string
    - name: startDate
      in: query
      description: Start date to filter by (YYYY-MM-DD)
      required: false
      schema:
        type: string
        format: date
    - name: endDate
      in: query
      description: End date to filter by (YYYY-MM-DD)
      required: false
      schema:
        type: string
        format: date
    - name: size
      in: query
      description: Number of items per page (1-20, default 10)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
    - name: nextPageToken
      in: query
      description: A cursor to use in pagination, if provided results will be returned from the token provided.
      required: false
      schema:
        type: integer
        minimum: 0
    - name: awards
      in: query
      description: Comma-separated award names to filter by (e.g., Award 1,Award 2,Award 3)
      required: false
      schema:
        type: string
    - name: messageType
      in: query
      description: Type of recognition message to return
      required: false
      schema:
        type: string
        enum:
          - json
          - html
        default: html
  responses:
    200:
      $ref: '../../responses/recognition-activity/get_activity_success.yaml'
    400:
      $ref: '../../responses/recognition-activity/get_activity_error.yaml'
    401:
      $ref: '../../responses/common/unauthorized.yaml'
    403:
      $ref: '../../responses/common/forbidden.yaml'
    500:
      $ref: '../../responses/recognition-activity/get_activity_error.yaml'