get:
  tags:
    - Recognition
  summary: Get recognition activity
  description: |
    Retrieve recognition activity data with optional filtering and pagination.
    The response will be paginated and sorted by creation date in descending order(newest first).
  operationId: getRecognitionActivity
  parameters:
    - name: awards
      in: query
      description: |
        Comma-separated award names to filter by (e.g., Award one,Award two,Award three).
        Each award name must be 100 characters or less.
        Maximum of 40 award names can be provided and overall 2000 characters or less.
      required: false
      schema:
        type: string
    - name: departments
      in: query
      description: |
        Comma-separated departments to filter by (e.g., Engineering,Sales,HR).
        Maximum of 40 departments can be provided and overall 2000 characters or less.
        Matches departments of giver or recipient department.
      required: false
      schema:
        type: string
    - name: endDate
      in: query
      description: End date for filtering by creation date (YYYY-MM-DD format).
      required: false
      schema:
        type: string
        format: date
    - name: locations
      in: query
      description: |
        Comma-separated locations to filter by (e.g., India,US).
        Maximum of 40 locations can be provided and overall 2000 characters or less.
        Matches locations of giver or recipient location.
      required: false
      schema:
        type: string
    - name: nextPageToken
      in: query
      description: A cursor to use in pagination, if provided results will be returned from the token provided.
      required: false
      schema:
        type: integer
        minimum: 0
    - name: size
      in: query
      description: Number of items per page (1-20, default 10).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
    - name: startDate
      in: query
      description: Start date for filtering by creation date (YYYY-MM-DD format).
      required: false
      schema:
        type: string
        format: date
    - name: type
      in: query
      description: |
        Comma-separated award types to filter by (e.g., PEER,SPOT).
        Allowed values: PEER, NOMINATION, DIRECT, SPOT, MILESTONE.
      required: false
      schema:
        type: string
  responses:
    '200':
      $ref: '../../responses/recognition/get_activity_success.yaml'
    '400':
      $ref: '../../responses/recognition/get_activity_validation.yaml'
    '401':
      $ref: '../../responses/common/unauthorized.yaml'
    '403':
      $ref: '../../responses/common/forbidden.yaml'
    '500':
      $ref: '../../responses/recognition/get_activity_error.yaml'