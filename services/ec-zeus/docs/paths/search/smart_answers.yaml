post:
  tags:
    - Enterprise search
  summary: Perform smart answer search
  description: Generates a smart answer for the searched query
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/search/smart_answers.yaml'
  responses:
    '200':
      $ref: '../../responses/search/smart_answers_success.yaml'
    '401':
      $ref: "../../responses/search/search_unauthorized_error.yaml"
    "400":
      $ref: "../../responses/search/search_bad_request.yaml"
    "500":
      $ref: "../../responses/search/search_internal_server_error.yaml"