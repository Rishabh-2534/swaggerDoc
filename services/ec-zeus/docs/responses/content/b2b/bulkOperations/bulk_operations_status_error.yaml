description: Error
content:
  application/json:
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              seq_id:
                type: integer
                example: 0
              field_name:
                type: string
                example: requestId
              error_code:
                type: integer
                example: 1004
              message:
                type: string
                example: "Invalid or expired request ID"
          example:
            - seq_id: 0
              field_name: requestId
              error_code: 1004
              message: "Invalid or expired request ID"
            - seq_id: 1
              field_name: opType
              error_code: 1005
              message: "Invalid operation type. Must be one of: content-author-change, content-author-report-generation"
        message:
          type: string
          example: "Failed to retrieve bulk operation status"
          description: General error message

