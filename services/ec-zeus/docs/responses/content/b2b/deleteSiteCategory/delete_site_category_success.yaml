description: Success
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
          description: Response status
          enum: [success, error]
        result:
          type: object
          description: Contains the deleted site category information
          properties:
            siteCategoryId:
              type: string
              example: "1a708b7b-2077-4272-8432-6720e1abe171"
              description: Unique identifier for the deleted site category
        message:
          type: string
          example: "Deleted site category successfully"
          description: Success message
