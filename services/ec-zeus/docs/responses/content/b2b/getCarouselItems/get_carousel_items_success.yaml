description: Success
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
          description: Response status
          enum: [success, error]
        result:
          type: object
          description: Contains carousel items data
          properties:
            layout:
              type: string
              example: showcase
              description: Layout type for the carousel
            isPersonalisedCarouselEnabled:
              type: boolean
              example: false
              description: Whether personalized carousel is enabled
            listOfItems:
              type: array
              description: List of carousel items
              items:
                type: object
                properties:
                  title:
                    type: string
                    nullable: true
                    description: Title of the carousel item
                  carouselItemId:
                    type: string
                    format: uuid
                    example: d7618f76-4674-435b-8496-063cf470ce6d
                    description: Unique identifier for the carousel item
                  itemType:
                    type: string
                    example: external
                    description: Type of carousel item (external, social_campaign, content)
                  status:
                    type: string
                    example: active
                    description: Status of the carousel item
                  order:
                    type: integer
                    example: 1
                    description: Display order of the carousel item
                  isDeleted:
                    type: boolean
                    example: false
                    description: Whether the carousel item is deleted
                  segmentId:
                    type: string
                    format: uuid
                    nullable: true
                    description: Segment ID if applicable
                  socialCampaignId:
                    type: string
                    format: uuid
                    nullable: true
                    description: Social campaign ID if applicable
                  contentId:
                    type: string
                    format: uuid
                    nullable: true
                    description: Content ID if applicable
                  siteId:
                    type: string
                    format: uuid
                    nullable: true
                    description: Site ID if applicable - will be null for global items or a UUID for site-specific items
                  createdBy:
                    type: string
                    format: uuid
                    example: e0853f94-c46d-41ca-89e1-5550a3638490
                    description: ID of the user who created the carousel item
                  deletedBy:
                    type: string
                    format: uuid
                    nullable: true
                    description: ID of the user who deleted the carousel item
                  updatedBy:
                    type: string
                    format: uuid
                    example: e0853f94-c46d-41ca-89e1-5550a3638490
                    description: ID of the user who last updated the carousel item
                  createdAt:
                    type: string
                    format: date-time
                    example: "2025-04-25T10:47:46.557Z"
                    description: Date and time when the carousel item was created
                  updatedAt:
                    type: string
                    format: date-time
                    example: "2025-04-25T10:47:46.557Z"
                    description: Date and time when the carousel item was last updated
                  item:
                    type: object
                    description: Details of the carousel item, varies by itemType
                  source:
                    type: string
                    example: curated
                    description: Source of the carousel item
        message:
          type: string
          example: ""
          description: Response message