description: Error updating site status
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - errors
      properties:
        status:
          type: string
          enum: [error]
          example: error
        message:
          type: string
          example: Error updating site status
        errors:
          type: array
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_SITE_ID
              message:
                type: string
                example: Invalid site id provided 