description: Site updated successfully
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - result
      properties:
        status:
          type: string
          enum: [success]
          example: success
        message:
          type: string
          example: Site updated successfully
        result:
          type: object
          required:
            - siteId
          properties:
            siteId:
              type: string
              format: uuid
              example: 02369949-cfc1-49a7-a2a7-d03afa9af84a