description: Error
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
          description: Response status
          enum: [success, error]
        errors:
          type: array
          description: List of validation or processing errors
          items:
            type: object
            properties:
              seq_id:
                type: integer
                example: 0
                description: Sequence identifier for the error
              field_name:
                type: string
                example: siteId
                description: Name of the field that caused the error
              error_code:
                type: integer
                example: 1001
                description: Numeric code identifying the type of error
              message:
                type: string
                example: "The 'siteId' field is required and must not be empty"
                description: Human-readable error message
