description: Success
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
          description: Response status
          enum: [success, error]
        result:
          type: object
          description: Contains the ID of the newly created event
          properties:
            contentId:
              type: string
              example: 49502e9f-a6e6-4773-a0b4-64be9388b7b1
              description: Unique identifier of the newly created event
        message:
          type: string
          example: Event created successfully
          description: Descriptive message about the operation result
