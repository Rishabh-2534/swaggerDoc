description: Error approving/rejecting content
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: "error"
          description: Status of the operation
          enum: [success, error]
        message:
          type: string
          example: "Failed to approve content"
          description: Descriptive error message about the operation failure
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
              description: Error code
            message:
              type: string
              example: "Request validation failed"
              description: Error message
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: "action"
                    description: Field that caused the error
                  message:
                    type: string
                    example: "Action is required"
                    description: Error message for the specific field
              description: Detailed validation errors
          required:
            - code
            - message
      required:
        - status
        - message
        - error
