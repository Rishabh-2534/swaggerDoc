description: Success
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
          description: Response status
          enum: [success, error]
        result:
          type: object
          description: Bulk operation file upload details
          properties:
            requestId:
              type: string
              format: uuid
              example: "207a1b73-a8d1-4001-a41e-5d524d2ee538"
              description: The request ID of the bulk operation
            opType:
              type: string
              example: "content-author-report-generation"
              description: Type of bulk operation
            fileId:
              type: string
              format: uuid
              example: "e474710d-876c-4938-8301-9a89575e0fee"
              description: Unique identifier of the uploaded file
            description:
              type: string
              example: "test file for upload author"
              description: Description of the uploaded file
            status:
              type: string
              example: "uploaded"
              description: Status of the file upload
              enum: [uploaded, processing, completed, failed]
            uploadedAt:
              type: string
              format: date-time
              example: "2025-10-08T22:09:31.730Z"
              description: Date and time when the file was uploaded
        message:
          type: string
          example: "File uploaded successfully for bulk operation"
          description: Response message
