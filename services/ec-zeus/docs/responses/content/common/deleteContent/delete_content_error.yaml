description: Error deleting content
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: "error"
          description: Status of the operation
          enum: [success, error]
        message:
          type: string
          example: "Failed to delete content"
          description: Descriptive error message about the operation failure
        error:
          type: object
          properties:
            code:
              type: string
              example: "CONTENT_NOT_FOUND"
              description: Error code
            message:
              type: string
              example: "Content not found or already deleted"
              description: Error message
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: "contentId"
                    description: Field that caused the error
                  message:
                    type: string
                    example: "Content with the specified ID does not exist"
                    description: Error message for the specific field
              description: Detailed validation errors
          required:
            - code
            - message
      required:
        - status
        - message
        - error
