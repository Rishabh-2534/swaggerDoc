description: Success
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
          description: Response status
          enum: [success, error]
        result:
          type: object
          description: Contains the ID of the content whose status was updated
          properties:
            contentId:
              type: string
              format: uuid
              example: 02369949-cfc1-49a7-a2a7-d03afa9af84a
              description: Unique identifier of the content whose status was updated
        message:
          type: string
          example: Content status updated successfully
          description: Descriptive message about the operation result
