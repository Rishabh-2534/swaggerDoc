description: Page updated successfully
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: "success"
          description: Status of the operation
        result:
          type: object
          properties:
            contentId:
              type: string
              format: uuid
              example: "91f29698-259f-48d6-9adc-a26eb984bf6d"
              description: ID of the updated content/page
          required:
            - contentId
        message:
          type: string
          example: "Page updated successfully"
          description: Success message
      required:
        - status
        - result
        - message
