description: Error
content:
  application/json:
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              seq_id:
                type: integer
                example: 0
              field_name:
                type: string
                example: filter
              error_code:
                type: integer
                example: 1012
              message:
                type: string
                example: "should be equal to one of the allowed values"
