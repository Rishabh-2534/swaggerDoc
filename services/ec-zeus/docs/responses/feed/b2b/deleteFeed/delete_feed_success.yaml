description: Success response for B2B feed deletion
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
          description: Response status
          enum: [success, error]
        result:
          type: object
          description: Contains the ID and deletion timestamp of the deleted feed
          properties:
            feedId:
              type: string
              format: uuid
              example: 49502e9f-a6e6-4773-a0b4-64be9388b7b1
              description: Unique identifier of the deleted feed
          required:
            - feedId
        message:
          type: string
          example: Feed deleted successfully via B2B API
          description: Descriptive message about the operation result
      required:
        - status
        - result
        - message

