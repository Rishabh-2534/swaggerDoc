description: Error response for B2B feed update
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
          description: Response status
          enum: [success, error]
        message:
          type: string
          example: Failed to update feed via B2B API
          description: Descriptive error message about the operation failure
        errors:
          type: array
          description: List of validation or processing errors
          items:
            type: object
            properties:
              field:
                type: string
                example: title
                description: Field that caused the error
              message:
                type: string
                example: Title is required for question-type feeds
                description: Error message for the specific field
