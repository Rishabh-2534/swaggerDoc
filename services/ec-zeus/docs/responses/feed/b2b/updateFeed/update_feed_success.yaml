description: Success response for B2B feed update
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
          description: Response status
          enum: [success, error]
        result:
          type: object
          description: Contains the ID of updated feed
          properties:
            feedId:
              type: string
              example: 49502e9f-a6e6-4773-a0b4-64be9388b7b1
              description: Unique identifier of the updated feed
        message:
          type: string
          example: Feed updated successfully
          description: Descriptive message about the operation result
