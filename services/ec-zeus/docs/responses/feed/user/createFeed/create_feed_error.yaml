description: Error response for feed creation
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
          description: Response status
          enum: [success, error]
        message:
          type: string
          example: Failed to create feed
          description: Descriptive error message about the operation failure
        errors:
          type: array
          description: List of validation or processing errors
          items:
            type: object
            properties:
              field:
                type: string
                example: textHtml
                description: Field that caused the error
              message:
                type: string
                example: textHtml is required
                description: Error message for the specific field
