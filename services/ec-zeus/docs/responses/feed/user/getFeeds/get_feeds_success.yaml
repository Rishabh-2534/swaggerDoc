description: Success
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Feed posts have been fetched successfully
        result:
          type: object
          properties:
            nextPageToken:
              type: integer
              example: 1759911721822
            size:
              type: integer
              example: 16
            total:
              type: integer
              example: 17
            listOfItems:
              type: array
              items:
                $ref: '../../../../schemas/feed/feed_object.yaml'
            sortBy:
              type: string
              example: createdAt