description: "Success"
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Audience fetched successfully"
        result:
          type: object
          properties:
            audienceId:
              type: string
              example: "8a636d37-4337-4f77-b177-deb3efcfd108"
            name:
              type: string
              example: "sim11sss1we278hijkl ijk"
            type:
              type: string
              example: "mixed"
            description:
              type: string
              nullable: true
              example: null
            isDeleted:
              type: boolean
              example: false
            isAutoGenerated:
              type: boolean
              example: false
            createdAt:
              type: string
              format: date-time
              example: "2025-08-12T04:20:17.782Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-08-12T04:21:52.740Z"
            categoryDetails:
              type: object
              properties:
                audienceCategoryId:
                  type: string
                  example: "57cc74a4-c059-428d-914c-caa4eba702a2"
                name:
                  type: string
                  example: "0000000000000000000000000000000000A1"
            parentDetails:
              type: object
              properties:
                audienceId:
                  type: string
                  example: "57cc74a4-c059-428d-914c-caa4eba702a2"
                name:
                  type: string
                  example: "0000000000000000000000000000000000A1"
                audienceMemberCount:
                  type: integer
                  example: 0
                breadcrumb:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "57cc74a4-c059-428d-914c-caa4eba702a2"
                      name:
                        type: string
                        example: "0000000000000000000000000000000000A1"
                type:
                  type: string
                  example: "category"
            createdBy:
              type: object
              properties:
                name:
                  type: string
                  example: "md. zaid"
                userId:
                  type: string
                  example: "dcc6dae5-404b-4e4d-b910-0cf0df153a5b"
            modifiedBy:
              type: object
              properties:
                name:
                  type: string
                  example: "Casey11 Bond"
                userId:
                  type: string
                  example: "a77d33c7-df51-4bac-8532-11a93884bfba"
            audienceMemberCount:
              type: integer
              example: 2
            usage:
              type: object
              properties:
                subscriptionCount:
                  type: integer
                  nullable: true
                  example: null
            audienceRule:
              type: object
              properties:
                AND:
                  type: array
                  items:
                    type: object
            status:
              type: string
              nullable: true
              example: null
