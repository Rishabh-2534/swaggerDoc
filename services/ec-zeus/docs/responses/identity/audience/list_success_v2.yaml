description: "Success"
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Audiences fetched successfully"
        result:
          type: object
          properties:
            pageSize:
              type: integer
              example: 2
            pageToken:
              type: integer
              example: 0
            listOfItems:
              type: array
              items:
                type: object
                properties:
                  audienceId:
                    type: string
                    example: "8a636d37-4337-4f77-b177-deb3efcfd108"
                  name:
                    type: string
                    example: "Marketing Team"
                  type:
                    type: string
                    example: "mixed"
                  description:
                    type: string
                    nullable: true
                    example: "Marketing team members"
                  createdOn:
                    type: string
                    format: date-time
                    example: "2025-08-12T04:20:17.782Z"
                  updatedOn:
                    type: string
                    format: date-time
                    example: "2025-08-12T04:21:52.740Z"
                  memberCount:
                    type: integer
                    example: 25
              example:
                - audienceId: "8a636d37-4337-4f77-b177-deb3efcfd108"
                  name: "Marketing Team"
                  type: "mixed"
                  description: "Marketing team members"
                  createdOn: "2025-08-12T04:20:17.782Z"
                  updatedOn: "2025-08-12T04:21:52.740Z"
                  memberCount: 25
                - audienceId: "9b747e48-5488-5g88-c288-f29efd0e219"
                  name: "Sales Team"
                  type: "mixed"
                  description: "Sales team members"
                  createdOn: "2025-08-12T05:15:30.123Z"
                  updatedOn: "2025-08-12T05:16:45.456Z"
                  memberCount: 15