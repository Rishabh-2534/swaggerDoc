description: "Error"
content:
  application/json:
    schema:
      type: object
      properties:
        message:
          type: string
          description: Error message describing what went wrong
          example: "The input provided is invalid."
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                description: Error message
                example: "AUDIENCE_USED_IN_USAGE: Audience used in acg groups or features"
