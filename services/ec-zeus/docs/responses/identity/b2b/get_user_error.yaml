description: "Validation Error Response"
content:
  application/json:
    schema:
      type: object
      properties:
        message:
          type: string
          description: Error message indicating validation failure
          example: "Invalid user ID"
        errors:
          type: array
          description: List of validation errors
          items:
            type: object
            properties:
              pathParam:
                type: string
                description: Name of the parameter that failed validation
                example: "userId"
              message:
                type: string
                description: Detailed error message for the validation failure
                example: "Invalid user ID"
            required:
              - pathParam
              - message
      required:
        - message
        - errors 