description: "Success"
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 200
        message:
          type: string
          description: Success message
          example: People list fetched successfully
        result:
          type: object
          properties:
            totalRecords:
              type: integer
              description: Total number of records found
              example: 7
            listOfItems:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier for the user
                    example: 55526ef2-752a-47e3-affa-2fa0eaadc5eb
                  firstName:
                    type: string
                    description: User's first name
                    example: Jhon
                  peopleId:
                    type: string
                    description: Identifier for the user within the people system
                    example: 55526ef2-752a-47e3-affa-2fa0eaadc5eb
                  lastName:
                    type: string
                    description: User's last name
                    example: smith
                  relevancyScore:
                    type: number
                    description: Score indicating relevancy of the user in the search results
                    example: 0
                  hireDate:
                    type: string
                    format: date-time
                    description: User's hire date
                    example: 2024-01-15T00:00:00.000Z
                  email:
                    type: string
                    description: User's email address
                    example: Jhon.smith@simpplr.com
                  mobile:
                    type: string
                    description: User's mobile number
                    example: 8560018230
                  status:
                    type: string
                    description: User's status
                    example: Active
                  phone:
                    type: string
                    description: User's phone number
                    example: 8560018230
                  phoneExtension:
                    type: string
                    description: Phone extension number
                    example: 91
                  namePronunciation:
                    type: string
                    description: Pronunciation of the user's name
                    example: Jhon
                  timezoneDetails:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Timezone identifier
                        example: 14
                      name:
                        type: string
                        description: Timezone name
                        example: America/Yakutat
                  imZoom:
                    type: string
                    description: User's Zoom ID
                    example: dees
                  imSkype:
                    type: string
                    description: User's Skype ID
                    nullable: true
                    example: null
                  imMicrosoftTeam:
                    type: string
                    description: User's Microsoft Teams ID
                    nullable: true
                    example: null
                  imSlack:
                    type: string
                    description: User's Slack ID
                    nullable: true
                    example: null
                  profileImageUrlOriginal:
                    type: string
                    description: URL to the user's original profile image
                    example: https://tango-new.dev.simpplr.xyz/content/o/0b000dcd-4a0a-422a-8397-908fa3e7a436
                  about:
                    type: string
                    description: JSON string containing details about the user
                    example: '{"type":"tiptap","value":{"type":"doc","content":[{"type":"paragraph","attrs":{"textAlign":"left"},"content":[{"type":"text","text":""}]}]}}'
                  microsoftTeamsUserId:
                    type: string
                    description: Microsoft Teams User ID
                    nullable: true
                    example: null
                  microsoftTeamsUserName:
                    type: string
                    description: Microsoft Teams User Name
                    nullable: true
                    example: null
                  microsoftTeamsConnectedAs:
                    type: string
                    description: Connection status for Microsoft Teams
                    nullable: true
                    example: null
                  microsoftTeamsTenantId:
                    type: string
                    description: Microsoft Teams Tenant ID
                    nullable: true
                    example: null
                  slackTeamId:
                    type: string
                    description: Slack Team ID
                    nullable: true
                    example: null
                  slackUserId:
                    type: string
                    description: Slack User ID
                    nullable: true
                    example: null
                  slackConnectedAs:
                    type: string
                    description: Connection status for Slack
                    nullable: true
                    example: null
                  slackTeamName:
                    type: string
                    description: Slack Team Name
                    nullable: true
                    example: null
                  pronouns:
                    type: string
                    description: User's preferred pronouns
                    example: he_him_his
                  isActive:
                    type: boolean
                    description: Indicates if the user is active
                    example: true
                  location:
                    type: string
                    description: User's location
                    example: he_him_his
                  city:
                    type: string
                    description: User's city
                    example: Massachusetts
                  state:
                    type: string
                    description: User's state
                    nullable: true
                    example: Boston
                  country:
                    type: string
