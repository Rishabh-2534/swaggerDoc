description: "Success"
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          description: Response status
          example: "success"
        message:
          type: string
          description: Success message
          example: "EC users fetched successfully"
        result:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier for the user
                    example: "85dcc783-6afd-4871-9ad6-637abb29841b"
                  username:
                    type: string
                    description: User's username/email
                    example: "ankur.gupta+test@simpplr.com"
                  status:
                    type: string
                    description: User's status
                    example: "Active"
                  firstName:
                    type: string
                    description: User's first name
                    example: "Am Edit User"
                  lastName:
                    type: string
                    description: User's last name
                    example: "Role Testing"
                  pronouns:
                    type: string
                    description: User's preferred pronouns
                    example: "he_him_his"
                  pronunciationUrl:
                    type: string
                    description: URL to pronunciation audio
                    nullable: true
                    example: null
                  extn:
                    type: string
                    description: Phone extension
                    nullable: true
                    example: null
                  photo:
                    type: string
                    description: Profile photo path
                    example: "/content/o/286d4be1-0232-462e-ac01-4049e4a53dae"
                  coverImage:
                    type: string
                    description: Cover image path
                    example: "/content/o/4702bd35-8c54-411f-8297-6f6be3001e96"
                  createdOn:
                    type: string
                    format: date-time
                    description: User creation date
                    example: "2024-10-16T02:16:38.763Z"
                  modifiedOn:
                    type: string
                    format: date-time
                    description: User last modified date
                    example: "2025-10-14T09:10:08.075Z"
                  mobile:
                    type: string
                    description: User's mobile number
                    nullable: true
                    example: null
                  phone:
                    type: string
                    description: User's phone number
                    nullable: true
                    example: null
                  about:
                    type: string
                    description: JSON string containing user's about information
                    example: '{"type":"tiptap","value":{"type":"doc","content":[{"type":"paragraph","attrs":{"textAlign":"left"},"content":[{"type":"text","text":"Am Edit User Role Testing hasnt added any about text"}]}]}}'
                  birthDayDay:
                    type: string
                    description: Birth day
                    example: "08"
                  birthDayMonth:
                    type: string
                    description: Birth month
                    example: "08"
                  linkedinUrl:
                    type: string
                    description: LinkedIn profile URL
                    nullable: true
                    example: null
                  twitterUrl:
                    type: string
                    description: Twitter profile URL
                    nullable: true
                    example: null
                  facebookUrl:
                    type: string
                    description: Facebook profile URL
                    nullable: true
                    example: null
                  youtubeUrl:
                    type: string
                    description: YouTube channel URL
                    nullable: true
                    example: null
                  instagramUrl:
                    type: string
                    description: Instagram profile URL
                    nullable: true
                    example: null
                  addressLine2:
                    type: string
                    description: Address line 2
                    nullable: true
                    example: null
                  city:
                    type: string
                    description: User's city
                    example: "Delhi"
                  state:
                    type: string
                    description: User's state
                    example: "Delhi"
                  postalCode:
                    type: string
                    description: Postal/ZIP code
                    nullable: true
                    example: null
                  country:
                    type: string
                    description: User's country
                    example: "India"
                  title:
                    type: string
                    description: User's job title
                    nullable: true
                    example: null
                  businessUnit:
                    type: string
                    description: Business unit
                    nullable: true
                    example: null
                  companyName:
                    type: string
                    description: Company name
                    example: "xabcde"
                  startDate:
                    type: string
                    format: date
                    description: Start date
                    example: "2025-10-03"
                  userType:
                    type: string
                    description: User type
                    nullable: true
                    example: null
                  peopleCategory:
                    type: string
                    description: People category
                    example: "New"
                  segmentId:
                    type: string
                    description: Segment ID
                    example: "ebeb0722-a38b-47b7-aabe-c867d9567f33"
                  timezone:
                    type: string
                    description: User's timezone
                    example: "America/Los_Angeles"
                  locale:
                    type: string
                    description: User's locale
                    example: "en-US"
                  managerId:
                    type: string
                    description: Manager ID
                    nullable: true
                    example: null
                  assistantId:
                    type: string
                    description: Assistant ID
                    nullable: true
                    example: "84c542ac-6fdf-4d37-8788-b0c4546eb9fa"
            pageToken:
              type: number
              description: Next page token
              example: 1
        responseTimeStamp:
          type: integer
          description: Response timestamp
          example: 1761108072626