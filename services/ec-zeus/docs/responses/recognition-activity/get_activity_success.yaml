description: "Recognition activity success response"
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        message:
          type: string
          example: "Recognition activity fetched successfully"
        result:
          type: object
          properties:
            nextPageToken:
              type: integer
              description: Token for pagination to get next page of results
              example: 15
            listOfItems:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier for the recognition activity
                    example: "uuid"
                  giver:
                    type: object
                    properties:
                      userId:
                        type: string
                        description: Returned only if giver type is USER
                        example: "user_123"
                      name:
                        type: string
                        description: Name of the giver who gave the award, returned only if giver type is not NO_AUTHOR
                        example: "John Doe"
                      profileImg:
                        type: string
                        nullable: true
                        description: Returned only if giver type is USER
                        example: "https://example.com/profile.jpg"
                      type:
                        type: string
                        enum:
                          - USER
                          - APPNAME
                          - NO_AUTHOR
                          - CUSTOM
                        description: Type of the giver
                        example: "USER"
                    description: Information about the giver who gave the award
                  recipients:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          description: User ID of the recipient
                          example: "user_456"
                        name:
                          type: string
                          description: Full name of the recipient
                          example: "Jane Smith"
                        profileImg:
                          type: string
                          nullable: true
                          description: Profile image URL of the recipient
                          example: "https://example.com/profile.jpg"
                      required:
                        - userId
                        - name
                    description: List of recipients who received the award
                  award:
                    type: object
                    properties:
                      awardName:
                        type: string
                        description: Name of the award given
                        example: "Employee of the Month"
                      description:
                        type: string
                        nullable: true
                        description: Description of the award
                        example: "Award for outstanding performance"
                      type:
                        type: string
                        enum:
                          - NOMINATION
                          - DIRECT
                          - PEER
                          - SPOT
                          - MILESTONE
                        description: Type of recognition
                        example: "PEER"
                      awardIcon:
                        type: string
                        nullable: true
                        description: Icon of the award
                        example: "https://example.com/icon.jpg"
                    required:
                      - awardName
                      - type
                    description: Award information
                  createdAt:
                    type: string
                    format: date-time
                    description: Date and time when the recognition was created
                    example: "2024-01-15T10:30:00Z"
                  modifiedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Date and time when the recognition was last modified
                    example: "2024-01-15T11:30:00Z"
                  message:
                    type: string
                    nullable: true
                    description: Optional message associated with the recognition
                    example: "Great work on the project!"
                required:
                  - id
                  - recipients
                  - award
                  - createdAt
              description: List of recognition activity items
          required:
            - nextPageToken
            - listOfItems
      required:
        - status
        - message
        - result 