- name: modifiedAfter
  in: query
  description: Filter content modified after this date-time. Must be in ISO 8601 UTC format (e.g. 2025-04-09T18:30:00.000Z)
  schema:
    type: string
    format: date-time
  required: false
- name: includeDeleted
  in: query
  description: Include deleted records in the response
  schema:
    type: boolean
    example: false
    default: false
  required: false
- name: includeContentFromDeactivatedSites
  in: query
  description: Include content from deactivated sites in the response
  schema:
    type: boolean
    example: false
    default: false
  required: false
- name: topicId
  in: query
  description: Filter content by topic ID. Required when filter is set to "topic"
  schema:
    type: string
    format: uuid
  required: false
- name: filter
  in: query
  description: Filter criteria for content. When set to "topic", topicId parameter is required
  schema:
    type: string
    enum: ["latest", "popular", "featured", "topic"]
  required: false
- name: status
  in: query
  description: Status of content to filter. Use 'all' to fetch content with any status
  schema:
    type: string
    enum: ["all", "published"]
    default: "published"
  required: false
- name: size
  in: query
  description: Number of items to return per page
  schema:
    type: integer
    minimum: 1
    maximum: 50
    default: 16
  required: false
- name: siteId
  in: query
  description: Optional site ID to filter the results
  schema:
    type: string
    format: uuid
  required: false
- name: contentIds
  in: query
  description: Filter content by specific content IDs (comma-separated UUIDs)
  schema:
    type: string
  style: form
  explode: false
  example: "55ec49b0-61a0-4162-9853-fd45ab2164fa,5c3af8ae-f856-4654-a990-4b46284526fe"
  required: false
- name: sortBy
  in: query
  description: Sort criteria for content
  schema:
    type: string
    enum: ["popularity", "createdNewest", "createdOldest", "publishedNewest", "publishedOldest", "modifiedNewest", "modifiedOldest", "eventOldest", "eventNewest", "eventStartOldest"]
  required: false
- name: type
  in: query
  description: Content type filter
  schema:
    type: string
    enum: ["page", "album", "event"]
  required: false
- name: contentSubType
  in: query
  description: Content sub-type filter
  schema:
    type: string
    enum: ["news", "knowledge"]
  required: false
- name: timePeriodInDays
  in: query
  description: Filter content published within specified time period in days
  schema:
    type: integer
    minimum: 0
  required: false
- name: publishStartDateSpan
  in: query
  description: Filter content by publish date span
  schema:
    type: string
    enum: ["past_year", "past_month", "past_week", "past_24_hours"]
  required: false
- name: pageCategoryId
  in: query
  description: Filter pages by category ID (only applicable for page content type)
  schema:
    type: string
    format: uuid
  required: false
- name: peopleId
  in: query
  description: Filter content by author ID
  schema:
    type: string
    format: uuid
  required: false
- name: contributionId
  in: query
  description: Filter content contributed by this user ID (authored or modified by this user)
  schema:
    type: string
    format: uuid
  required: false
- name: isMustRead
  in: query
  description: Whether the content is must read or not
  schema:
    type: boolean
    example: false
    default: false
  required: false
- name: nextPageToken
  in: query
  description: Token for fetching the next page of results
  schema:
    type: integer
  required: false
- name: reportType
  in: query
  description: Specifies which bulk operation report to generate. Use 'content_author_report_generation' for author change CSV export.
  schema:
    type: string
    enum: ["content_author_report_generation"]
  required: false
- name: requestedBy
  in: query
  description: ID of the user who requested the bulk operation (required when reportType is provided)
  schema:
    type: string
    format: uuid
    example: "e0853f94-c46d-41ca-89e1-5550a3638490"
  required: false