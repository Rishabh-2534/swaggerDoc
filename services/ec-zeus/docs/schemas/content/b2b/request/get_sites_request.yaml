type: object
properties:
  size:
    type: integer
    description: Maximum number of results to return
    example: 16
    default: 16  
    minimum: 1   
    maximum: 500 

  nextPageToken:
    type: integer
    description: Token for fetching the next page of results  

  filter:
    type: string
    description: Optional filter for results
    enum:
      - featured  
    minLength: 1  
    maxLength: 200
    example: featured

  sortBy:
    type: string
    description: Technique for sorting results
    default: alphabetical  
    enum:
      - alphabetical
      - featured
      - createdNewest
      - popular
      - updatedNewest
    minLength: 1
    maxLength: 255
    example: popular

  siteIds:
    type: array
    items:
      type: string
      format: uuid
    description: Optional list of site UUIDs to filter the results  

  updatedAfter:
    type: string
    format: date-time
    description: Only return results updated after this date-time  

  includeDeactivated:
    type: boolean
    description: Whether to include deactivated sites or not
    default: false  

additionalProperties: false
