- name: size
  in: query
  description: Number of items to return per page
  schema:
    type: integer
    minimum: 1
    maximum: 1000
    default: 50
  required: false
- name: modifiedAfter
  in: query
  description: Filter topics modified after this date-time. Must be in ISO 8601 UTC format (e.g. 2025-04-09T18:30:00.000Z)
  schema:
    type: string
    format: date-time
    example: "2025-04-09T18:30:00.000Z"
  required: false
- name: includeDeleted
  in: query
  description: Include deleted topics in the response
  schema:
    type: string
    enum: ["true", "false"]
    default: "false"
  required: false
- name: nextPageToken
  in: query
  description: Token for fetching the next page of results
  schema:
    type: integer
    default: 0
  required: false