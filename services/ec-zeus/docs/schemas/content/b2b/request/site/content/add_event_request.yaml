type: object
properties:
  listOfFiles:
    type: array
    items:
      $ref: "../../../../common/request/file/file.yaml"
    description: Array of file attachments

  publishAt:
    type: string
    format: date-time
    example: "2025-04-09T18:30:00.000Z"
    description: Date and time when the event should be published (required when publishingStatus is 'schedule'). Must be in ISO 8601 UTC format

  publishTo:
    type: string
    format: date-time
    nullable: true
    example: "2025-12-31T23:59:59.000Z"
    description: Date and time when the content should expire/unpublish. Must be in ISO 8601 UTC format

  startsAt:
    type: string
    format: date-time
    example: "2025-04-09T10:00:00.000Z"
    description: Event start date and time in ISO 8601 format

  endsAt:
    type: string
    format: date-time
    example: "2025-04-09T12:00:00.000Z"
    description: Event end date and time in ISO 8601 format

  bodyHtml:
    type: string
    description: Main content of the event in HTML format

  publishingStatus:
    type: string
    enum:
      - immediate
      - schedule
    description: Publishing status of the event

  timezoneIso:
    type: string
    example: "America/Los_Angeles"
    description: Timezone ISO string for the event

  location:
    type: string
    minLength: 1
    description: Event location

  directions:
    type: array
    items:
      type: string
    maxItems: 10
    description: Array of directions to the event location

  imgLayout:
    type: string
    enum:
      - small
      - hidden
      - fullscreen
      - wide
    description: Layout style for the featured image

  listOfOrganizers:
    type: array
    items:
      type: string
      format: uuid
    description: Array of organizer user IDs

  mapURL:
    type: string
    nullable: true
    description: URL to map for the event location

  imgCaption:
    type: string
    nullable: true
    maxLength: 255
    description: Caption for the featured image

  title:
    type: string
    maxLength: 255
    description: Title of the event

  isFeedEnabled:
    type: boolean
    description: Whether the event appears in feeds

  isQuestionAnswerEnabled:
    type: boolean
    description: Whether question and answer feature is enabled

  listOfTopics:
    type: array
    nullable: true
    items:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
      required:
        - name
      additionalProperties: false
    description: Array of topics associated with the event

  summary:
    type: string
    nullable: true
    maxLength: 10000
    description: Summary of the event content

  imgLandscapeFile:
    type: string
    format: uuid
    nullable: true
    description: UUID of the landscape image file

  imgFile:
    type: string
    format: uuid
    nullable: true
    description: UUID of the main image file

  imgOriginalFile:
    type: string
    format: uuid
    nullable: true
    description: UUID of the original image file

  rsvp:
    type: object
    properties:
      dueAtDate:
        type: string
        format: date-time
        description: RSVP due date
      hasMaybeOption:
        type: boolean
        description: Whether RSVP has maybe option
      capacityCount:
        type: integer
        nullable: true
        minimum: 1
        maximum: 1000000
        default: null
        description: Maximum capacity for the event
      noteLabel:
        type: string
        nullable: true
        maxLength: 255
        description: Label for RSVP note field
    additionalProperties: false
    description: RSVP configuration for the event

  isAllDay:
    type: boolean
    description: Whether the event is an all-day event

  language:
    type: string
    description: Language of the event content

  createdBy:
    type: string
    format: uuid
    description: UUID of the user creating the event

required:
  - publishingStatus
  - title
  - bodyHtml
  - timezoneIso
  - isAllDay
  - isFeedEnabled
  - location
  - startsAt
  - endsAt
  - createdBy
additionalProperties: false
