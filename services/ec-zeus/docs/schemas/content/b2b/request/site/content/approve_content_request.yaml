type: object
properties:
  action:
    type: string
    enum:
      - approve
      - reject
    description: The action to perform on the content
  rejectionComment:
    type: string
    minLength: 1
    maxLength: 250
    description: Comment explaining why the content was rejected (required when action is 'reject')
  modifiedBy:
    type: string
    format: uuid
    description: UUID of the user performing the action (B2B specific field)
required:
  - action
  - modifiedBy
additionalProperties: false
