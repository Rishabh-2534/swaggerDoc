- name: size
  in: query
  description: Number of site categories to return per page
  schema:
    type: integer
    minimum: 1
    maximum: 1000
    default: 50
  required: false

- name: nextPageToken
  in: query
  description: Token for fetching the next page of results
  schema:
    type: integer
  required: false

- name: sortBy
  in: query
  description: Sorting method for site categories
  schema:
    type: string
    enum:
      - alphabetical
      - natural
      - latest
    default: alphabetical
  required: false

- name: term
  in: query
  description: Search term for filtering site categories
  schema:
    type: string
    maxLength: 255
  required: false

- name: includeDeleted
  in: query
  description: Whether to include deleted categories in the response
  schema:
    type: boolean
    example: false
    default: false
  required: false
  
- name: modifiedAfter
  in: query
  description: Filter content modified after this date-time. Must be in ISO 8601 UTC format (e.g. 2025-04-09T18:30:00.000Z)
  schema:
    type: string
    format: date-time
  required: false
