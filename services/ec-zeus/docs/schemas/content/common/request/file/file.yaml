title: Files
type: object
description: File object with provider-specific properties
properties:
  file_id:
    type: string
    description: File identifier
  provider:
    type: string
  name:
    type: string
    nullable: true
    description: File name
  type:
    type: string
    nullable: true
    description: File type/MIME type
  size:
    type: integer
    minimum: 0
    nullable: true
    description: File size in bytes
  version:
    type: integer
    minimum: 1
    nullable: true
    description: File version number
required:
  - file_id
  - provider
allOf:
  - oneOf:
      - type: object
        title: Intranet File
        description: File stored in intranet with UUID file_id
        properties:
          provider:
            type: string
            enum: [intranet]
          file_id:
            type: string
            format: uuid
        required:
          - provider
          - file_id
        additionalProperties: false

      - type: object
        title: Google Drive File
        description: File stored in Google Drive with required metadata
        properties:
          provider:
            type: string
            enum: [googledrive]
          file_id:
            type: string
          name:
            type: string
          size:
            type: integer
            minimum: 0
          type:
            type: string
            nullable: true
          version:
            type: integer
            minimum: 1
        required:
          - provider
          - file_id
          - name
          - size
          - type
          - version
        additionalProperties: false

      - type: object
        title: Box File
