type: object
properties:
  size:
    type: integer
    description: Maximum number of results to return
    example: 16
  siteId:
    type: string
    description: ID of the Site to search for
    example: 'd096db67-954a-4ff5-94a7-ccc437f2fd81'
  term:
    type: string
    description: Search term
    example: ''
  context:
    type: string
    description: Context of the search
    example: 'siteFiles'
  provider:
    type: string
    description: Provider of the search
    enum:
      - intranet
      - googledrive
      - sharepoint
      - onedrive
      - box
      - native_video
      - dropbox
    example: 'intranet'
  sortBy:
    type: string
    description: Technique for sorting results
    enum:
      - alphabetical
      - createdNewest
      - createdOldest
      - modifiedNewest
      - modifiedOldest
    example: createdNewest
  fileManagerView:
    type: boolean
    description: Whether the user is a file manager or not
    enum:
      - true
      - false
  isMediaManager:
    type: boolean
    description: Whether the user is a media manager or not
    enum:
      - true
      - false
  filter:
    type: string
    description: Filter criteria for search
    enum:
      - favorites
      - write_folders
      - this_week
      - this_month
      - last_week
      - owned_by_me
      - recents
  directory:
    type: string
    description: Directory to search in
  action:
    type: string
    description: Action to perform
    enum:
      - favorite
      - unfavorite
  id:
    type: string
    description: ID of the file
  isFolder:
    type: boolean
    description: Whether the file is a folder or not
    enum:
      - true
      - false
  isDrive:
    type: boolean
    description: Whether the file is a drive or not
    enum:
      - true
      - false
