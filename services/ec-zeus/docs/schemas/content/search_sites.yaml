type: object
properties:
  size:
    type: integer
    description: Maximum number of results to return
    example: 4
  sortBy:
    type: string
    description: Technique for sorting results
    enum:
      - alphabetical
      - createdNewest
      - popular
      - featured
    example: popular
  filter:
    type: string
    enum:
      - featured
      - unfeatured
      - recentUsedSites
      - popular
      - following
      - member
      - manager
      - owner
      - deactivated
      - public
      - private
      - unlisted
      - favourites
    example: popular
  categoryId:
    type: string
    description: category of sites to search for
  term:
    type: string
    description: Search term
  canManage:
    type: boolean
    description: Whether the user can manage the site
    enum:
      - true
      - false
  includeDeactivated:
    type: boolean
    description: Whether to include deactivated sites or not
    enum:
      - true
      - false
  canAccess:
    type: boolean
    description: Whether the user can access the site
    enum:
      - true
      - false
