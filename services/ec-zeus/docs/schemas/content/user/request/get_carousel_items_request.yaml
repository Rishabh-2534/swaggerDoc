- name: siteId
  in: query
  description: Optional parameter to filter carousel items by site ID. If not provided, returns all home carousel items. Use null to explicitly request only global items.
  schema:
    type: string
    format: uuid
  required: false
- name: segmentId
  in: query
  description: Filter carousel items by segment ID
  schema:
    type: string
    format: uuid
  required: false
- name: modifiedAfter
  in: query
  description: Filter carousel items modified after this date-time. Must be in ISO 8601 UTC format (e.g. 2025-04-09T18:30:00.000Z)
  schema:
    type: string
    format: date-time
  required: false
- name: includeDeleted
  in: query
  description: Include deleted carousel items in the response
  schema:
    type: boolean
    example: false
    default: false
  required: false
- name: includeDisabledContentTypes
  in: query
  description: Include items with disabled content types in the response
  schema:
    type: boolean
    example: false
    default: false
  required: false
- name: ignoreCarouselDisablement
  in: query
  description: Ignore carousel disablement settings
  schema:
    type: boolean
    example: false
    default: false
  required: false
