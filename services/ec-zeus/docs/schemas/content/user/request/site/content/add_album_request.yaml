type: object
properties:
  listOfFiles:
    type: array
    items:
      $ref: "../../../../common/request/file/file.yaml"
    description: Array of file attachments

  publishAt:
    type: string
    format: date-time
    example: "2025-04-09T18:30:00.000Z"
    description: Date and time when the album should be published (required when publishingStatus is 'schedule'). Must be in ISO 8601 UTC format

  imgLandscape:
    type: string
    nullable: true
    description: URL of the landscape image

  publishTo:
    type: string
    format: date-time
    nullable: true
    example: "2025-12-31T23:59:59.000Z"
    description: Date and time when the content should expire/unpublish. Must be in ISO 8601 UTC format

  bodyHtml:
    type: string
    description: Main content of the album in HTML format

  publishingStatus:
    type: string
    enum:
      - immediate
      - schedule
    description: Publishing status of the album

  imgLayout:
    type: string
    enum:
      - small
      - hidden
      - wide
    description: Layout style for the featured image

  imgCaption:
    type: string
    nullable: true
    maxLength: 255
    description: Caption for the featured image

  imgLandscapeFile:
    type: string
    format: uuid
    nullable: true
    description: UUID of the landscape image file

  title:
    type: string
    maxLength: 255
    description: Title of the album

  isMaximumWidth:
    type: boolean
    description: Whether to use maximum width layout

  isFeedEnabled:
    type: boolean
    description: Whether the album appears in feeds

  isQuestionAnswerEnabled:
    type: boolean
    description: Whether question and answer feature is enabled

  listOfTopics:
    type: array
    nullable: true
    items:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
      required:
        - name
      additionalProperties: false
    description: Array of topics associated with the album

  summary:
    type: string
    nullable: true
    maxLength: 255
    description: Summary of the album content

  listOfAlbumMedia:
    type: array
    minItems: 1
    items:
      type: object
      properties:
        id:
          type: string
          description: Media ID
        description:
          type: string
          nullable: true
          maxLength: 255
          description: Description of the media
        altText:
          type: string
          nullable: true
          maxLength: 255
          description: Alternative text for the media
        fileId:
          type: string
          description: File ID
        provider:
          type: string
          enum:
            - googledrive
            - box
            - onedrive
            - sharepoint
            - dropbox
            - native_video
          description: Provider of the media file
        name:
          type: string
          description: Name of the media file
        type:
          type: string
          description: Type of the media file
        size:
          type: string
          description: Size of the media file
        thumbnailUrl:
          type: string
          description: URL of the thumbnail
        version:
          type: number
          description: Version of the media file
        videoStatus:
          type: number
          description: Status of the video if applicable
      required:
        - id
      additionalProperties: false
    description: Array of media items in the album

  isOpenToSubmissions:
    type: boolean
    description: Whether the album is open to submissions

  coverImageMediaId:
    type: string
    description: ID of the media item to use as cover image

  language:
    type: string
    description: Language of the album content

required:
  - publishingStatus
  - title
  - bodyHtml
  - coverImageMediaId
  - listOfAlbumMedia
additionalProperties: false
