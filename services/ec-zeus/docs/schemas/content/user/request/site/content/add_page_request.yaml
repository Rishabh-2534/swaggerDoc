type: object
properties:
  contentSubType:
    type: string
    enum:
      - news
      - knowledge
    description: Type of content being created

  listOfFiles:
    type: array
    items:
      $ref: "../../../../common/request/file/file.yaml"
    description: Array of file attachments

  listOfInlineVideos:
    type: array
    items:
      $ref: "../../../../common/request/file/file.yaml"
    description: Array of inline video files

  publishAt:
    type: string
    format: date-time
    example: "2025-04-09T18:30:00.000Z"
    description: Date and time when the content should be published (required when publishingStatus is 'schedule'). Must be in ISO 8601 UTC format (e.g. 2025-04-09T18:30:00.000Z)

  publishTo:
    type: string
    nullable: true
    description: Target audience for publishing

  bodyHtml:
    type: string
    description: Main content of the page in HTML format

  publishingStatus:
    type: string
    enum:
      - immediate
      - schedule
    description: Publishing status of the content

  imgLayout:
    type: string
    enum:
      - small
      - fullscreen
      - hidden
      - wide
    description: Layout style for the featured image

  imgCaption:
    type: string
    nullable: true
    maxLength: 255
    description: Caption for the featured image

  imgLandscapeFile:
    type: string
    format: uuid
    nullable: true
    description: UUID of the landscape image file

  imgFile:
    type: string
    format: uuid
    nullable: true
    description: UUID of the main image file

  imgOriginalFile:
    type: string
    format: uuid
    nullable: true
    description: UUID of the original image file

  imgLandscape:
    type: string
    nullable: true
    description: URL of the landscape image

  title:
    type: string
    maxLength: 255
    description: Title of the page

  isMaximumWidth:
    type: boolean
    description: Whether to use maximum width layout

  isFeedEnabled:
    type: boolean
    description: Whether the page appears in feeds

  isQuestionAnswerEnabled:
    type: boolean
    description: Whether question and answer feature is enabled

  listOfTopics:
    type: array
    nullable: true
    items:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
      required:
        - name
      additionalProperties: false
    description: Array of topics associated with the page

  category:
    type: object
    properties:
      id:
        type: string
        format: uuid
        nullable: true
      name:
        type: string
    required:
      - id
      - name
    description: Category information for the page

  summary:
    type: string
    nullable: true
    maxLength: 10000
    description: Summary of the page content

  language:
    type: string
    description: Language of the content

  isNewTiptap:
    type: boolean
    description: Whether using new Tiptap editor

  manualTransEnabled:
    type: boolean
    description: Whether manual translation is enabled


required:
  - contentSubType
  - bodyHtml
  - publishingStatus
  - title
  - category
