type: object
properties:
  textHtml:
    type: string
    example: "<p>Updated B2B comment content</p>"
    description: Updated HTML content of the comment
  modifiedBy:
    type: string
    format: uuid
    example: "e5149282-2b89-4588-8b70-590ea3218e83"
    description: ID of the user modifying the comment
  listOfAttachedFiles:
    type: array
    items:
      $ref: "../../common/request/file/file.yaml"
    default: []
    description: Array of attached files
required:
  - textHtml
  - modifiedBy
additionalProperties: false