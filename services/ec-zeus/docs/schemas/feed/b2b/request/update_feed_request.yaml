type: object
properties:
  textHtml:
    type: string
    description: The HTML content of the feed item
  
  ignoreToxic:
    type: boolean
    default: false
    description: Whether to ignore toxic content detection
  
  siteId:
    type: string
    format: uuid
    nullable: true
    description: The ID of the site (required for site-scoped feeds)
  
  title:
    type: string
    nullable: true
    maxLength: 255
    description: The title of the feed item (required for question-type feeds, optional for post-type feeds)

  listOfAttachedFiles:
    type: array
    items:
      $ref: "../../../content/common/request/file/file.yaml"
    default: []
    description: Array of attached files
    
  modifiedBy:
    type: string
    format: uuid
    description: UUID of the user modifying the feed (B2B specific field)

required:
  - textHtml
  - modifiedBy

# Note: scope, type, and variant are immutable and omitted from update schema
# Server validates title requirement based on existing feed type:
# - Question feeds: title is required (400 if missing/null)

additionalProperties: false
