title: Files
type: object
description: File object with provider-specific properties
properties:
  fileId:
    type: string
    description: File identifier
  provider:
    type: string
  name:
    type: string
    nullable: true
    description: File name
  type:
    type: string
    nullable: true
    description: File type/MIME type
  size:
    type: integer
    minimum: 0
    nullable: true
    description: File size in bytes
  thumbnail:
    type: string
    nullable: true
    description: Thumbnail URL
required:
  - fileId
  - provider
allOf:
  - oneOf:
      - type: object
        title: Intranet File
        description: File stored in intranet with UUID fileId
        properties:
          provider:
            type: string
            enum: [intranet]
          fileId:
            type: string
            format: uuid
          name:
            type: string
            nullable: true
            description: File name
          size:
            type: integer
            minimum: 0
            nullable: true
            description: File size in bytes
          type:
            type: string
            nullable: true
            description: File type/MIME type
          thumbnail:
            type: string
            nullable: true
            description: Thumbnail URL
        required:
          - provider
          - fileId
        additionalProperties: false

      - type: object
        title: Google Drive File
        description: File stored in Google Drive with required metadata
