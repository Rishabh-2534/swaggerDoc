type: object
properties:
  textHtml:
    type: string
    description: The HTML content of the feed item
  
  ignoreToxic:
    type: boolean
    default: false
    description: Whether to ignore toxic content detection
  
  scope:
    type: string
    enum:
      - public
      - site
    description: The scope of the feed item - public or site-specific
  
  siteId:
    type: string
    format: uuid
    nullable: true
    example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    description: The ID of the site (required when scope is 'site', null for public scope)
  
  type:
    type: string
    enum:
      - post
      - question
    description: The type of feed item
  
  title:
    type: string
    nullable: true
    maxLength: 255
    description: The title of the feed item (required when type is 'question')
  
  variant:
    type: string
    default: standard
    description: The variant of the feed item

  listOfAttachedFiles:
    type: array
    items:
      $ref: "../../../content/common/request/file/file.yaml"
    default: []
    description: Array of attached files

# Use oneOf to handle conditional validation for OpenAPI 3.0.2 compatibility
oneOf:
  # Case 1: public scope + post type
  - properties:
      textHtml:
        type: string
        description: The HTML content of the feed item
      ignoreToxic:
        type: boolean
        default: false
        description: Whether to ignore toxic content detection
      scope:
        type: string
        const: public
        description: The scope of the feed item - public
      siteId:
        type: string
        format: uuid
        nullable: true
        example: null
        description: The ID of the site (null for public scope)
      type:
        type: string
        const: post
        description: The type of feed item
      title:
        type: string
        nullable: true
        maxLength: 255
        description: The title of the feed item (optional for posts)
      variant:
        type: string
        default: standard
        description: The variant of the feed item
      listOfAttachedFiles:
        type: array
        items:
          $ref: "../../../content/common/request/file/file.yaml"
        default: []
        description: Array of attached files
    required:
      - textHtml
      - scope
      - type
      - variant
    additionalProperties: false

  # Case 2: public scope + question type
  - properties:
      textHtml:
        type: string
        description: The HTML content of the feed item
      ignoreToxic:
        type: boolean
        default: false
        description: Whether to ignore toxic content detection
      scope:
        type: string
        const: public
        description: The scope of the feed item - public
      siteId:
        type: string
        format: uuid
        nullable: true
        example: null
        description: The ID of the site (null for public scope)
      type:
        type: string
        const: question
        description: The type of feed item
      title:
        type: string
        nullable: false
        maxLength: 255
        description: The title of the feed item (required for questions)
      variant:
        type: string
        default: standard
        description: The variant of the feed item
      listOfAttachedFiles:
        type: array
        items:
          $ref: "../../../content/common/request/file/file.yaml"
        default: []
        description: Array of attached files
    required:
      - textHtml
      - scope
      - type
      - title
      - variant
    additionalProperties: false

  # Case 3: site scope + post type
  - properties:
      textHtml:
        type: string
        description: The HTML content of the feed item
      ignoreToxic:
        type: boolean
        default: false
        description: Whether to ignore toxic content detection
      scope:
        type: string
        const: site
        description: The scope of the feed item - site-specific
      siteId:
        type: string
        format: uuid
        nullable: false
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        description: The ID of the site (required for site scope)
      type:
        type: string
        const: post
        description: The type of feed item
      title:
        type: string
        nullable: true
        maxLength: 255
        description: The title of the feed item (optional for posts)
      variant:
        type: string
        default: standard
        description: The variant of the feed item
      listOfAttachedFiles:
        type: array
        items:
          $ref: "../../../content/common/request/file/file.yaml"
        default: []
        description: Array of attached files
    required:
      - textHtml
      - scope
      - siteId
      - type
      - variant
    additionalProperties: false

  # Case 4: site scope + question type
  - properties:
      textHtml:
        type: string
        description: The HTML content of the feed item
      ignoreToxic:
        type: boolean
        default: false
        description: Whether to ignore toxic content detection
      scope:
        type: string
        const: site
        description: The scope of the feed item - site-specific
      siteId:
        type: string
        format: uuid
        nullable: false
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        description: The ID of the site (required for site scope)
      type:
        type: string
        const: question
        description: The type of feed item
      title:
        type: string
        nullable: false
        maxLength: 255
        description: The title of the feed item (required for questions)
      variant:
        type: string
        default: standard
        description: The variant of the feed item
      listOfAttachedFiles:
        type: array
        items:
          $ref: "../../../content/common/request/file/file.yaml"
        default: []
        description: Array of attached files
    required:
      - textHtml
      - scope
      - siteId
      - type
      - title
      - variant
    additionalProperties: false

# Examples for different cases
examples:
  public_post:
    summary: Public post example
    value:
      textHtml: "<p>This is a public feed post.</p>"
      ignoreToxic: false
      scope: public
      siteId: null
      type: post
      variant: standard
      listOfAttachedFiles: []
  
  public_question:
    summary: Public question example
    value:
      textHtml: "<p>Ronaldo vs Messi</p>"
      ignoreToxic: false
      scope: public
      siteId: null
      type: question
      title: "Ronaldo vs Messi. Who is better?"
      variant: standard
      listOfAttachedFiles: []
  
  site_post:
    summary: Site-specific post example
    value:
      textHtml: "<p>This is a site-specific feed post.</p>"
      ignoreToxic: false
      scope: site
      siteId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      type: post
      variant: standard
      listOfAttachedFiles: []
  
  site_question:
    summary: Site-specific question example
    value:
      textHtml: "<p>How can we improve our team collaboration?</p>"
      ignoreToxic: false
      scope: site
      siteId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      type: question
      title: "Team Collaboration Ideas"
      variant: standard
      listOfAttachedFiles: []
