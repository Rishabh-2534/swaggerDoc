type: object
description: Update user request
properties:
  username:
    type: string
    description: User's username
    example: jhon.smith
  status:
    type: string
    description: User's status
    enum:
      - Active
      - Inactive
      - Freezed
  firstName:
    type: string
    description: User's first name
    example: Jhon
  lastName:
    type: string
    description: User's last name
    example: smith
  pronouns:
    type: string
    description: User's pronouns
    example: he/him
  pronunciationUrl:
    type: string
    description: URL to the user's pronunciation
    example: /pronunciation/55526ef2-752a-47e3-affa-2fa0eaadc5eb
  email:
    type: string
    description: User's email address
    example: jhon.smith@example.com
  mobile:
    type: string
    description: User's mobile phone number
    example: "234567890"
  phone:
    type: string
    description: User's phone number
    example: "234567890"
  extn:
    type: string
    description: User's extension
    example: "+91"
  about:
    type: string
    description: User's about
    example: I am a software engineer
  photo:
    type: string
    description: URL to the user's photo
    example: /photo/55526ef2-752a-47e3-affa-2fa0eaadc5eb
  employeeNumber:
    type: string
    description: User's employee number
    example: "123456"
  coverImage:
    type: string
    description: URL to the user's cover image
    example: /cover-image/55526ef2-752a-47e3-affa-2fa0eaadc5eb
  peopleCategory:
    type: string
    description: User's people category
    example: Employee
  timezone:
    type: string
    description: User's timezone
    example: Asia/Kolkata
  locale:
    type: string
    description: User's locale
    example: en_IN
  managerId:
    type: string
    description: User's manager id
    example: 55526ef2-752a-47e3-affa-2fa0eaadc5eb
  assistantId:
    type: string
    description: User's assistant id
    example: 55526ef2-752a-47e3-affa-2fa0eaadc5eb
  isEmailDisplayable:
    type: boolean
    description: Whether the user's assistant email is displayable
    example: true
  isMobileDisplayable:
    type: boolean
    description: Whether the user's assistant mobile is displayable
    example: true
  isPhoneDisplayable:
    type: boolean
    description: Whether the user's assistant phone is displayable
    example: true
  zoom:
    type: string
    description: User's zoom url
    example: https://zoom.us/j/1234567890
  skype:
    type: string
    description: User's skype url
    example: https://skype.com/jhon.smith
  linkedInUrl:
    type: string
