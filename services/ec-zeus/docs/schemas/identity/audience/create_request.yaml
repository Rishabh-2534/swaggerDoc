
required:
  - name
  - type
  - listOfPeople
  - listOfConditions
type: object
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
  fileSize:
    type: number
    minimum: 1
  fileTitle:
    type: string
    minLength: 1
    maxLength: 256
  fileId:
    type: string
    format: uuid
  type:
    type: string
    enum:
      - conditions
      - people
      - csv
  listOfConditions:
    description: This should be empty array in case of no selected.
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        values:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "Engineering"
              name:
                type: string
                example: "Engineering"
              userCount:
                type: integer
                example: 0
              authoredBy:
                type: string
                nullable: true
                example: null
              canEdit:
                type: boolean
                nullable: true
                example: null
              canDelete:
                type: boolean
                nullable: true
                example: null
              isNew:
                type: boolean
                nullable: true
                example: null
              isFollowing:
                type: boolean
                nullable: true
                example: null
              img:
                type: string
                nullable: true
                example: null
            required:
              - name
          minItems: 1
  listOfPeople:
    description: This should be empty array in case of no selected.
    type: array
    items:
      type: string
      format: uuid
additionalProperties: false