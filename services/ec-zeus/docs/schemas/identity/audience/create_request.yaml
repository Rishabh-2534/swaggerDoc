
required:
  - name
  - type
  - listOfPeople
  - listOfConditions
type: object
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
  fileSize:
    type: number
    minimum: 1
  fileTitle:
    type: string
    minLength: 1
    maxLength: 256
  fileId:
    type: string
    format: uuid
  type:
    type: string
    enum:
      - conditions
      - people
      - csv
  listOfConditions:
    description: This should be empty array in case of no selected.
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: company_name, country, department, title, start_date, city, division, state, segment can be possible values. Note - for custom fields respected field name should be used.
        label:
          type: string
          description: Company name, Country, Department, Job Title, Start date, User city, User division, User state, Segment can be possible values. Note - for custom fields respected label should be used.
          enum:
            - Company name
            - Country
            - Department
            - Job Title
        values:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "Engineering"
              name:
                type: string
                example: "Engineering"
            required:
              - name
          minItems: 1
  listOfPeople:
    description: This should be empty array in case of no selected.
    type: array
    items:
      type: string
      format: uuid
additionalProperties: false