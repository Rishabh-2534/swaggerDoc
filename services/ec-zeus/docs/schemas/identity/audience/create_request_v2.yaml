                              - custom_field_22
                              - custom_field_23
                              - custom_field_24
                              - custom_field_25
                              # Groups section attributes
                              - ad_group
                              # Special attributes
                              - segment_id
                          operator:
                            type: string
                            description: "Operator for the condition"
                            enum:
                              # String operators
                              - IS
                              - IS_NOT
                              - CONTAINS
                              - STARTS_WITH
                              - ENDS_WITH
                              # Date operators
                              - ON
                              - ON_OR_BEFORE
                              - ON_OR_AFTER
                              - BEFORE
                              - AFTER
                              - BETWEEN
                              # Boolean operators
