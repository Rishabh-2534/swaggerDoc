type: object
properties:
  name:
    type: string
    description: "Name of the audience"
    example: "Marketing Team"
  description:
    type: string
    nullable: true
    description: "Description of the audience"
    example: "Audience for marketing team members"
  type:
    type: string
    description: "Type of audience"
    example: "mixed"
    enum:
      - mixed
  audienceRule:
    type: object
    description: "Audience rule configuration with flexible AND/OR structure"
    oneOf:
      - type: object
        description: "AND group - all conditions must be true"
        properties:
          AND:
            type: array
            description: "All conditions in this array must be true (AND logic)"
            minItems: 1
            items:
              oneOf:
                - type: object
                  description: "OR group - any condition can be true"
                  properties:
                    OR:
                      type: array
                      description: "Array of single conditions (any can be true)"
                      minItems: 1
                      items:
                        type: object
                        properties:
                          values:
                            type: array
                            description: "Array of values for the condition"
                            minItems: 1
                            items:
                              type: object
                              properties:
                                value:
                                  type: string
                                  description: "Value for the condition"
                                label:
                                  type: string
                                  description: "Optional label for the value"
                          attribute:
                            type: string
                            description: "Attribute to filter on"
                            enum:
                              # User section attributes
                              - user_id
                              - first_name
                              - last_name
                              # Role section attributes
                              - title
                              - company_name
                              - business_unit
                              - department
                              - division
                              - user_type
                              - start_date
                              - is_manager
                              # Address section attributes
                              - city
                              - state
                              - country_name
                              # Custom fields
