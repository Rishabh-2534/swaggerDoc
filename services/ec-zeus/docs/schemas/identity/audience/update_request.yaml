required:
  - name
  - type
  - listOfPeople
  - listOfConditions
type: object
properties:
  name:
    type: string
    example: "Engineers"
  type:
    type: string
    example: "conditions"
  listOfPeople:
    type: array
    items:
      type: object
    example: []
  listOfConditions:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: company_name, country, department, title, start_date, city, division, state, segment can be possible values. Note - for custom fields respected field name should be used.
          example: department
        label:
          type: string
          description: Company name, Country, Department, Job Title, Start date, User city, User division, User state, Segment can be possible values. Note - for custom fields respected label should be used.
          example: Department
        values:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "Engineering"
              name:
                type: string
                example: "Engineering"