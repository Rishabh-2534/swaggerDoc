required:
  - name
  - type
  - listOfPeople
  - listOfConditions
type: object
properties:
  name:
    type: string
    example: "Engineers"
  type:
    type: string
    example: "conditions"
  listOfPeople:
    type: array
    items:
      type: object
    example: []
  listOfConditions:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          example: "department"
        label:
          type: string
          example: "Department"
        values:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "Engineering"
              name:
                type: string
                example: "Engineering"
              userCount:
                type: integer
                example: 0
              authoredBy:
                type: string
                nullable: true
                example: null
              canEdit:
                type: boolean
                nullable: true
                example: null
              canDelete:
                type: boolean
                nullable: true
                example: null
              isNew:
                type: boolean
                nullable: true
                example: null
              isFollowing:
                type: boolean
                nullable: true
                example: null
              img:
                type: string
                nullable: true
                example: null