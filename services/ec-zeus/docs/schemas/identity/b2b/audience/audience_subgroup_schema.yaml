type: object
description: >
   "Subgroup schema for nested AND/OR conditions. 
properties:
  AND:
    type: array
    description: "Nested AND conditions"
    items:
      $ref: './audience_condition_schema.yaml'
  OR:
    type: array
    description: "Nested OR conditions"
    items:
      $ref: './audience_condition_schema.yaml'
  attribute:
    type: string
    description: "Attribute to filter on"
    example: "segmentId"
  fieldType:
    type: string
    description: "Type of field"
    enum:
      - segment
      - regular
      - adGroup
      - oktaGroup
      - googleGroup
  operator:
    type: string
    description: >

        "Operator support by attribute: 


        LastName and FirstName support CONTAINS, STARTS_WITH, ENDS_WITH.


        userId supports IS, IS_NOT.


        startDate supports ON, ON_OR_BEFORE, ON_OR_AFTER, BEFORE, AFTER, BETWEEN. 


        isManager (boolean) supports IS. 


        adGroup, oktaGroup, and googleGroup support IS, IS_NOT, ALL. 
        
        
        All other standard and custom fields support IS, IS_NOT, CONTAINS, STARTS_WITH, ENDS_WITH."
    enum:
      - ALL
      - IS
      - IS_NOT
      - CONTAINS
      - STARTS_WITH
      - ENDS_WITH
      - ON
      - ON_OR_BEFORE
      - ON_OR_AFTER
      - BEFORE
      - AFTER
      - BETWEEN
  values:
    type: array
    description: "Array of values for the condition"
    minItems: 1
    items:
      type: object
      properties:
        value:
          type: string
          description: "Value for the condition"
      required: ["value"]

