type: object
properties:
  name:
    type: string
    description: "Name of the audience"
    example: "Marketing Audience"
    minLength: 1
    maxLength: 100
  type:
    type: string
    description: "Type of audience"
    example: "mixed"
    enum:
      - mixed
  description:
    type: string
    nullable: true
    description: "Description of the audience"
    example: "Audience for marketing team members"
  rule:
    $ref: './audience_rule_schema.yaml'
  parentAudienceId:
    type: string,
    description: >
        Audience category ID.


        This is valid for only ABAC enabled tenants. For non-ABAC tenants, if you pass anything here it will throw error.


        when you pass parentAudienceId in request audience create inside an existing audience. And newly created audience become child of parent audience provied in request.

    example: "39437d92-9be0-4a25-8543-55bdab74df4e"
    nullable: true
  audienceCategoryName:
    type: string
    description: >
      Audience category name.

      
      This is valid for only ABAC enabled tenants. For non-ABAC tenants, if you pass anything here it will throw error.

      
      When you pass audienceCategoryName in request audience create inside that category. 
      
      
      If audience with same name already exist we create audience inside that category otherwise will create new category first and then audience inside it.
    example: "Marketing"
    nullable: true
  audienceCategoryId:
    type: string
    format: uuid
    description: >
      Audience category ID.

      
      This is valid for only ABAC enabled tenants. For non-ABAC tenants, if you pass anything here it will throw error.
       

      when you pass audienceCategoryId in request audience create inside that category.
    example: "57cc74a4-c059-428d-914c-caa4eba702a2"
    nullable: true
  sourceType:
    type: string
    description: "Source type of the audience"
    example: "app_managed"
    enum:
      - app_managed
      - user_managed
      - system_managed
    nullable: true
required:
  - name
  - type
additionalProperties: false

