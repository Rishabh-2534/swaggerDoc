required:
  - grant_type
  - client_id
  - client_secret
type: object
properties:
  grant_type:
    type: string
    description: The grant type to be used.
    example: client_credentials
    enum:
      - client_credentials
  client_id:
    type: string
    description: The client id specific to your client application.
  client_secret:
    type: string
    description: The client secret specific to you client application.
  scope:
    type: string
    enum: ['read', 'write', 'everything']
    description: The client secret specific to you client application.
