type: object
properties:
  sortBy:
    type: string
    description: List of fields to sort by.
    example: firstName
  sortOrder:
    type: string
    description: sort order (asc or desc).
    example: ASC/DESC
  pageSize:
    type: integer
    description: Number of results to return.
    maximum: 200
    example: 16
  pageToken:
    type: integer
    description: >
      Page token to get the next page of results. (can also be sent as `offset`)
      should be a string returned as `nextPageToken` from previous page request
  q:
    type: string
    description: Query string for searching users (supported firstname and lastname).
    example: "abc"
  username:
    type: array
    items:
      type: string
    description: List of usernames to filter by.
    example: ["john.doe", "jane.smith"]
  firstName:
    type: array
    items:
      type: string
    description: List of first names to filter by.
    example: ["John", "Jane"]
  lastName:
    type: array
    items:
      type: string
    description: List of last names to filter by.
    example: ["Doe", "Smith"]
  email:
    type: array
    items:
      type: string
    description: List of email addresses to filter by.
    example: ["john@example.com", "jane@example.com"]
  mobile:
    type: array
    items:
      type: string
    description: List of mobile numbers to filter by.
    example: ["+1234567890", "+0987654321"]
  phone:
    type: array
    items:
      type: string
    description: List of phone numbers to filter by.
    example: ["+1234567890", "+0987654321"]
  extn:
    type: array
    items:
      type: string
    description: List of phone extensions to filter by.
    example: ["123", "456"]
  about:
    type: array
    items:
      type: string
    description: List of about descriptions to filter by.
    example: ["Software Engineer", "Product Manager"]
  segmentId:
    type: array
    items:
      type: string
    description: List of segment IDs to filter by.
    example: ["84c542ac-6fdf-4d37-8788-b0c4546eb9fa"]
  locale:
    type: array
    items:
      type: string
    description: List of locales to filter by.
    example: ["en-US", "en-GB"]
  licenseType:
    type: array
    items:
      type: string
    description: List of license types to filter by.
    example: ["Premium", "Basic"]
  peopleCategoryId:
    type: array
    items:
      type: string
    description: List of people category names to filter by.
    example: ["Us Team"]
  timezone:
    type: array
    items:
      type: string
    description: List of timezones to filter by.
    example: ["Asia/Kolkata"]
  expertiseId:
    type: array
    items:
      type: string
    description: List of expertise names to filter by.
    example: ["Java"]
  title:
    type: array
    items:
      type: string
    description: List of titles to filter by.
    example: ["Software Developer"]
  userType:
    type: array
    items:
      type: string
    description: List of user types to filter by.
    example: ["Contractor"]
  division:
    type: array
    items:
      type: string
    description: List of divisions to filter by.
    example: ["Developer"]
  department:
    type: array
    items:
      type: string
    description: List of departments to filter by.
    example: ["Engineering"]
  businessUnit:
    type: array
    items:
      type: string
    description: List of business units to filter by.
    example: ["Tata"]
  companyName:
    type: array
    items:
      type: string
    description: List of company names to filter by.
    example: ["simpplr"]
  employeeNumber:
    type: array
    items:
      type: string
    description: List of employee numbers to filter by.
    example: ["EMP001", "EMP002"]
  startDate:
    oneOf:
      - type: object
        properties:
          start:
            type: string
            format: date
            description: Start date for start date filter
            example: "2024-01-01"
          end:
            type: string
            format: date
            description: End date for start date filter
            example: "2024-12-31"
        required: ["start", "end"]
      - type: string
        pattern: "^(\\d+)(d|m|M|w|y)$"
        description: Relative date filter for start date (e.g., "20d" for 20 days, "2m" for 2 months, "1M" for 1 month, "3w" for 3 weeks, "1y" for 1 year)
        example: "20d"
    description: Filter by start date range. Can be either an object with start/end dates or a relative date string.
  createdOn:
    oneOf:
      - type: object
        properties:
          start:
            type: string
            format: date
            description: Start date for created date filter
            example: "2024-01-01"
          end:
            type: string
            format: date
            description: End date for created date filter
            example: "2024-12-31"
        required: ["start", "end"]
      - type: string
        pattern: "^(\\d+)(d|m|M|w|y)$"
        description: Relative date filter for created date (e.g., "20d" for 20 days, "2m" for 2 months, "1M" for 1 month, "3w" for 3 weeks, "1y" for 1 year)
        example: "20d"
    description: Filter by created date range. Can be either an object with start/end dates or a relative date string.
  modifiedOn:
    oneOf:
      - type: object
        properties:
          start:
            type: string
            format: date
            description: Start date for modified date filter
            example: "2024-01-01"
          end:
            type: string
            format: date
            description: End date for modified date filter
            example: "2024-12-31"
        required: ["start", "end"]
      - type: string
        pattern: "^(\\d+)(d|m|M|w|y)$"
        description: Relative date filter for modified date (e.g., "20d" for 20 days, "2m" for 2 months, "1M" for 1 month, "3w" for 3 weeks, "1y" for 1 year)
        example: "20d"
    description: Filter by modified date range. Can be either an object with start/end dates or a relative date string.
  workAnniversary:
    oneOf:
      - type: object
        properties:
          start:
            type: string
            format: date
            description: Start date for work anniversary filter
            example: "2024-01-01"
          end:
            type: string
            format: date
            description: End date for work anniversary filter
            example: "2024-12-31"
        required: ["start", "end"]
      - type: string
        pattern: "^(\\d+)(d|m|M|w|y)$"
        description: Relative date filter for work anniversary (e.g., "20d" for 20 days, "2m" for 2 months, "1M" for 1 month, "3w" for 3 weeks, "1y" for 1 year)
        example: "20d"
    description: Filter by work anniversary date range. Can be either an object with start/end dates or a relative date string.
  birthAnniversary:
    oneOf:
      - type: object
        properties:
          start:
            type: string
            format: date
            description: Start date for birth anniversary filter
            example: "2024-01-01"
          end:
            type: string
            format: date
            description: End date for birth anniversary filter
            example: "2024-12-31"
        required: ["start", "end"]
      - type: string
        pattern: "^(\\d+)(d|m|M|w|y)$"
        description: Relative date filter for birth anniversary (e.g., "60d" for 60 days, "2m" for 2 months, "1M" for 1 month, "3w" for 3 weeks, "1y" for 1 year)
        example: "60d"
    description: Filter by birth anniversary date range. Can be either an object with start/end dates or a relative date string.
  managerId:
    type: array
    items:
      type: string
    description: List of manager IDs to filter by.
    example: ["84c542ac-6fdf-4d37-8788-b0c4546eb9fa"]
  assistantId:
    type: array
    items:
      type: string
    description: List of assistant IDs to filter by.
    example: ["84c542ac-6fdf-4d37-8788-b0c4546eb9fa"]
  payCurrency:
    type: array
    items:
      type: string
    description: List of payment currencies to filter by.
    example: ["PYG", "ARS"]
  pronouns:
    type: array
    items:
      type: string
    description: List of pronouns to filter by.
    example: ["she_her_hers", "he_him_his"]
  state:
    type: array
    items:
      type: string
    description: List of states to filter by.
    example: ["New Delhi", "Uttarakhand"]
  city:
    type: array
    items:
      type: string
    description: List of cities to filter by.
    example: ["Delhi", "Mumbai"]
  country:
    type: array
    items:
      type: string
    description: List of countries to filter by.
    example: ["India", "USA"]
  addressLine1:
    type: array
    items:
      type: string
    description: List of address line 1 values to filter by.
    example: ["Road no 1"]
  addressLine2:
    type: array
    items:
      type: string
    description: List of address line 2 values to filter by.
    example: ["road no 2"]
  location:
    type: array
    items:
      type: object
      properties:
        city:
          type: string
          description: City name
          example: "Delhi"
        state:
          type: string
          description: State name
          example: "Maharashtra"
        country:
          type: string
          description: Country name
          example: "India"
      required: ["city"]
    description: List of location objects with city and optional state.
    example: [{"city": "Delhi"}, {"city": "Amaravati", "state": "Maharashtra"}]
    customField:
          type: array
          items:
            type: string
          description: Custom field ending with __c, must be an array of strings.
          example: ["value1", "value2"]