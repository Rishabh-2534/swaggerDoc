type: object
properties:
  sortBy:
    type: array
    items:
      type: string
    description: List of fields to sort by and the sort order (asc or desc).
    example: ["user_name", "asc"]
  pageSize:
    type: integer
    description: Number of results to return. (can also be sent as `size`)
    maximum: 200
    example: 16
  pageToken:
    type: string
    description: >
      Page token to get the next page of results.
      should be a string returned as `nextPageToken` from previous page request
  q:
    type: string
    description: Query string for searching users.
    example: ""
  peopleCategoryId:
    type: array
    items:
      type: string
    description: List of people category IDs to filter by.
    example: ["Us Team"]
  timezone:
    type: array
    items:
      type: string
    description: List of timezones to filter by.
    example: ["Pacific/Gambier"]
  expertiseId:
    type: array
    items:
      type: string
    description: List of expertise IDs to filter by.
    example: ["Java"]
  assistant_id:
    type: array
    items:
      type: string
    description: List of assistant IDs to filter by.
    example: ["55526ef2-752a-47e3-affa-2fa0eaadc5eb"]
  location:
    type: array
    items:
      type: string
    description: List of locations to filter by.
    example: ["Gurugram#city"]
  title:
    type: array
    items:
      type: string
    description: List of titles to filter by.
    example: ["Software Developer"]
  user_type:
    type: array
    items:
      type: string
    description: List of user types to filter by.
    example: ["Contractor"]
  division:
    type: array
    items:
      type: string
    description: List of divisions to filter by.
    example: ["Developer"]
  department:
    type: array
    items:
      type: string
    description: List of departments to filter by.
    example: ["Engineering"]
  business_unit:
    type: array
    items:
      type: string
    description: List of business units to filter by.
    example: ["Tata"]
  company_name:
    type: array
    items:
      type: string
    description: List of company names to filter by.
    example: ["simpplr"]
  start_date:
    type: array
    items:
      type: string
    description: Date range for the start date filter (start and end date).
    example: ["2024-05-20", "2024-06-18"]