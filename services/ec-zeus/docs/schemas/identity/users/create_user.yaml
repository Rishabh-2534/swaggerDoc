required:
  - personalInfo
  - roleId
type: object
properties:
  personalInfo:
    type: object
    properties:
      firstName:
        type: string
        example: ""
      lastName:
        type: string
        example: ""
      timezoneId:
        type: integer
        example: 1
      languageId:
        type: integer
        example: 1
      localeId:
        type: integer
        example: 1
      email:
        type: string
        example: ""
  roleId:
    type: string
    format: uuid
    example: a8d8c6b0-8968-44a7-a034-00110cc25817