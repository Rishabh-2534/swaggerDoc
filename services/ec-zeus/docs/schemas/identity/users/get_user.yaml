type: object
properties:
  id:
    type: string
    description: Unique identifier for the user
    example: 55526ef2-752a-47e3-affa-2fa0eaadc5eb
  username:
    type: string
    description: User's username
    example: jhon.smith
  status:
    type: string
    description: User's status
    example: Active
  firstName:
    type: string
    description: User's first name
    example: Jhon
  lastName:
    type: string
    description: User's last name
    example: smith
  pronouns:
    type: string
    description: User's pronouns
    example: he/him
  pronunciationUrl:
    type: string
    description: URL to the user's pronunciation
    example: /pronunciation/55526ef2-752a-47e3-affa-2fa0eaadc5eb
  email:
    type: string
    description: User's email address
    example: jhon.smith@example.com
  mobile:
    type: string
    description: User's mobile phone number
    example: "234567890"
  phone:
    type: string
    description: User's phone number
    example: "234567890"
  extn:
    type: string
    description: User's extension
    example: "+91"
  about:
    type: string
    description: User's about
    example: I am a software engineer
  photo:
    type: string
    description: URL to the user's photo
    example: /photo/55526ef2-752a-47e3-affa-2fa0eaadc5eb
  employeeNumber:
    type: string
    description: User's employee number
    example: "123456"
  coverImage:
    type: string
    description: URL to the user's cover image
    example: /cover-image/55526ef2-752a-47e3-affa-2fa0eaadc5eb
  birthDayDay:
    type: string
    description: User's birth day
    example: "30"
  birthDayMonth:
    type: string
    description: User's birth month
    example: "10"
  peopleCategory:
    type: string
    description: User's people category
    example: Employee
  segmentId:
    type: string
    description: User's segment id
    example: 55526ef2-752a-47e3-affa-2fa0eaadc5eb
  timezone:
    type: string
    description: User's timezone
    example: Asia/Kolkata
  locale:
    type: string
    description: User's locale
    example: en_IN
  reprovOn:
    type: string
    description: User's reprovisioning date
    example: 2021-01-01
  deprovOn:
    type: string
    description: User's deprovisioning date
    example: 2021-01-01
  managerId:
    type: string
    description: User's manager id
    example: 55526ef2-752a-47e3-affa-2fa0eaadc5eb
  assistantId:
    type: string
    description: User's assistant id
    example: 55526ef2-752a-47e3-affa-2fa0eaadc5eb
  isEmailDisplayable:
    type: boolean
    description: Whether the user's assistant email is displayable
    example: true
  isMobileDisplayable:
    type: boolean
    description: Whether the user's assistant mobile is displayable
    example: true
  isPhoneDisplayable:
    type: boolean
    description: Whether the user's assistant phone is displayable
    example: true
  zoom:
    type: string
    description: User's zoom url
    example: https://zoom.us/j/1234567890
  skype:
    type: string
    description: User's skype url
    example: https://skype.com/jhon.smith
  linkedInUrl:
    type: string
    description: User's linkedin url
    example: https://linkedin.com/in/jhon.smith
  twitterUrl:
    type: string
    description: User's twitter url
    example: https://twitter.com/jhon.smith
  facebookUrl:
    type: string
    description: User's facebook url
    example: https://facebook.com/jhon.smith
  youtubeUrl:
    type: string
    description: User's youtube url
    example: https://youtube.com/jhon.smith
  instagramUrl:
    type: string
    description: User's instagram url
    example: https://instagram.com/jhon.smith
  payCurrency:
    type: string
    description: User's pay currency
    example: USD
  createdOn:
    type: string
    description: User's creation timestamp
    example: 2024-12-18T12:54:06.729Z
  modifiedOn:
    type: string
    description: User's update timestamp
    example: 2024-12-18T12:54:06.729Z
  licenseType:
    type: string
    description: User's license type
    example: Corporate
  addressLine1:
    type: string
    description: User's address line 1
    example: 123 Main St
  addressLine2:
    type: string
    description: User's address line 2
    example: Apt 1
  city:
    type: string
    description: User's city
    example: New York
  state:
    type: string
    description: User's state
    example: NY
  postalCode:
    type: string
    description: User's postal code
    example: "10001"
  country:
    type: string
    description: User's country
    example: USA
  title:
    type: string
    description: User's title
    example: Software Engineer
  department:
    type: string
    description: User's department
    example: Engineering
  division:
    type: string
    description: User's division
    example: Engineering
  businessUnit:
    type: string
    description: User's business unit
    example: Engineering
  companyName:
    type: string
    description: User's company name
    example: Example Inc.
  startDate:
    type: string
    description: User's start date
    example: 2024-12-18
  userType:
    type: string
    description: User's user type
    example: Employee
  "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$":
    oneOf:
      - type: string
      - type: array
        items:
          type: string
    description: |
      User's custom fields (if applicable)
      if parseCustomFields is true and custom field types is enabled; then multi-select custom fields will be returned as an array of strings else it will be returned as a string with semicolons (;) separated values
  "^.*__c$":
    oneOf:
      - type: string
      - type: array
        items:
          type: string
    description: |
      User's custom fields (if applicable) 
      if parseCustomFields is true and custom field types is enabled; then multi-select custom fields will be returned as an array of strings else it will be returned as a string with semicolons (;) separated values