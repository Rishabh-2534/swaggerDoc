required:
  - category
  - action_by
  - action_at
type: object
properties:
  category:
    type: string
    description:
      This is to identify type of notification. Currently only support
      inapp category.
    example: inapp
    enum:
      - inapp
  action_at:
    type: string
    description: UTC time at which action was performed
  action_by:
    type: string
    description: Email of the person who performed this action
