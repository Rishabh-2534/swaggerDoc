type: object
properties:
  search_term:
    type: string
    description: The search term to be used for the smart answer search.
  search_token:
    type: string
    description: The token generated from the search API (optional)
    nullable: true
  caller_context:
    type: string
    description: The value for this can be either "global_search" ->  Starting of a conversation or "follow_up_search" -> Follow up question in current conversation thread. 
  conversation_id:
    type: string
    description: Unique id that keeps track of the conversation thread. Note -> Same user account can have multiple conversation threads simultaneously.