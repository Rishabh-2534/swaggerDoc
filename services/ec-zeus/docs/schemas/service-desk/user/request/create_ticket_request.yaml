required:
  - ticketType
  - requesterId
  - workspaceId
type: object
properties:
  ticketType:
    type: string
    description: The type of ticket being created.
    enum:
      - serviceRequest
      - incident
  requesterId:
    type: string
    format: uuid
    description: The UUID of the user creating the ticket.
  serviceId:
    type: string
    format: uuid
    description: The UUID of the service being requested. Required in case when `ticketType` is serviceRequest.
  requestForUserId:
    type: string
    format: uuid
    description: The UUID of the user for whom the request is being made. Required only if `isRequestingForOthers` is true.
  isRequestingForOthers:
    type: boolean
    description: Indicates if the request is being made for another user.
  workspaceId:
    type: string
    format: uuid
    description: The UUID of the workspace. Required for tickets.
  title:
    type: string
    description: The title of the incident. Must be 2-60 characters long.
    minLength: 2
    maxLength: 60
  description:
    type: string
    description: A detailed description of the incident. Must be 10-500 characters long.
    minLength: 10
    maxLength: 500
  subject:
    type: string
    description: The subject of the service request. Must be 2-60 characters long.
    minLength: 2
    maxLength: 60
  severity:
    type: string
    description: The severity level of the ticket.
    enum:
      - low
      - medium
      - high
      - urgent